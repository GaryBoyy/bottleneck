<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bottleneck</title>
<meta name="description" content="An investing journal on the companies behind the AI buildout, and the economy around them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
<style>
/* Layout: a component datasheet for one portfolio. Tickers set like part numbers,
   spec tables in stock posts, hairline rules, and a single cobalt line. */
:root{
  --bg:#F4F5F7;
  --surface:#FFFFFF;
  --surface-2:#F8F9FB;
  --ink:#10141B;
  --ink-2:#39404C;
  --muted:#646C7A;
  --faint:#8A919D;
  --rule:#DFE2E8;
  --rule-2:#C9CED6;
  --grid:#E9ECF0;
  --accent:#2448D8;
  --accent-ink:#1E3CB8;
  --accent-wash:#E9EDFC;
  --up:#11744A;
  --down:#B4382A;
  --ctx-1:#565E6B;
  --ctx-2:#8F96A1;
  --cash:#BAC0C9;
  --head-bg:rgba(244,245,247,.88);
  --shadow:0 6px 18px rgba(16,20,27,.10);

  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --maxw:1120px;
  --readw:700px;
  --gutter:clamp(16px,4vw,32px);
  --radius:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#151920; --surface-2:#11151B;
    --ink:#E9ECF1; --ink-2:#C3C9D2; --muted:#8E96A3; --faint:#6B7380;
    --rule:#252B34; --rule-2:#353C47; --grid:#1F242C;
    --accent:#7F9BFF; --accent-ink:#9DB2FF; --accent-wash:#1A2140;
    --up:#4CC38A; --down:#F07A6A;
    --ctx-1:#A3AAB6; --ctx-2:#5D6572; --cash:#3A414C;
    --head-bg:rgba(13,16,21,.86);
    --shadow:0 8px 22px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151920; --surface-2:#11151B;
  --ink:#E9ECF1; --ink-2:#C3C9D2; --muted:#8E96A3; --faint:#6B7380;
  --rule:#252B34; --rule-2:#353C47; --grid:#1F242C;
  --accent:#7F9BFF; --accent-ink:#9DB2FF; --accent-wash:#1A2140;
  --up:#4CC38A; --down:#F07A6A;
  --ctx-1:#A3AAB6; --ctx-2:#5D6572; --cash:#3A414C;
  --head-bg:rgba(13,16,21,.86);
  --shadow:0 8px 22px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}

/* ---------- Type roles ---------- */
.label{
  font-family:var(--f-display);font-size:.75rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0;
  font-family:var(--f-display);font-size:.8125rem;color:var(--muted);
}
.meta .cat{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem;color:var(--ink-2)}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.chip{
  display:inline-block;font-family:var(--f-mono);font-size:.75rem;font-weight:500;
  letter-spacing:.02em;line-height:1;color:var(--ink-2);
  padding:5px 6px 4px;border:1px solid var(--rule-2);border-radius:3px;background:var(--surface);
  text-decoration:none;white-space:nowrap;
}
a.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.up{color:var(--up)} .down{color:var(--down)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.site-head{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--head-bg);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--rule);
}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;height:58px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark{width:20px;height:20px;fill:var(--accent);flex:none}
.brand-name{font-family:var(--f-display);font-stretch:88%;font-weight:750;font-size:1.25rem;letter-spacing:-.01em}
.nav{display:flex;gap:4px}
.nav a{
  font-family:var(--f-display);font-size:.9375rem;font-weight:600;text-decoration:none;color:var(--muted);
  padding:18px 10px 16px;border-bottom:2px solid transparent;transition:color .15s ease,border-color .15s ease;
}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{min-height:70vh}
.view{padding-block:36px 72px}

/* ---------- Journal: lead ---------- */
.about{margin:0 0 28px;font-size:1.0625rem;color:var(--muted);max-width:60ch}
.lead{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:32px;align-items:start;margin-bottom:56px}
.latest{min-width:0;padding-top:4px}
.latest .meta{margin-bottom:14px}
.latest .meta .new{color:var(--accent-ink)}
.latest-title{
  margin:0 0 14px;font-family:var(--f-display);font-stretch:80%;font-weight:720;
  font-size:clamp(2.125rem,1.35rem + 3.1vw,3.5rem);line-height:1.02;letter-spacing:-.018em;text-wrap:balance;
}
.latest-title a{text-decoration:none}
.latest-title a:hover{color:var(--accent-ink)}
.latest .dek{margin:0 0 18px;font-size:1.3125rem;line-height:1.45;color:var(--ink-2);max-width:40ch}
.latest .row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.more{
  font-family:var(--f-display);font-weight:600;font-size:.9375rem;color:var(--accent-ink);text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
}
.more:hover{text-decoration:underline;text-underline-offset:3px}

.snapshot{
  min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:20px 20px 18px;
}
.snapshot .label{display:flex;justify-content:space-between;gap:8px;margin:0 0 14px}
.kpis{margin:0;display:grid;gap:16px}
.kpi{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 12px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.kpi:last-child{border-bottom:0;padding-bottom:0}
.kpi dt{font-family:var(--f-display);font-size:.875rem;font-weight:600;color:var(--ink-2)}
.kpi .v{margin:0;font-family:var(--f-display);font-weight:650;font-size:1.75rem;line-height:1;letter-spacing:-.01em}
.kpi .cap{margin:0;grid-column:1 / -1;font-family:var(--f-display);font-size:.8125rem;color:var(--muted)}
.spark{display:block;width:100%;height:36px;margin:6px 0 0;grid-column:1 / -1}
.snapshot .more{margin-top:16px}

/* ---------- Journal: archive ---------- */
.archive-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--ink)}
.section-title{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.75rem;letter-spacing:-.01em;line-height:1}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule-2);border-radius:var(--radius);background:var(--surface);padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;cursor:pointer;border-radius:4px;
  font-family:var(--f-display);font-size:.875rem;font-weight:600;color:var(--muted);padding:6px 11px;
  transition:background .15s ease,color .15s ease;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.search input{
  width:220px;font-family:var(--f-display);font-size:.875rem;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--radius);padding:8px 12px;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.active-filter{display:flex;align-items:center;gap:10px;margin-top:16px;font-family:var(--f-display);font-size:.875rem;color:var(--ink-2)}
.clear{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-family:var(--f-mono);font-size:.75rem;font-weight:600;color:var(--accent-ink);
  border:1px solid var(--accent);background:var(--accent-wash);border-radius:3px;padding:4px 8px;
}
.month{margin-top:28px}
.month-h{
  margin:0;display:flex;align-items:center;gap:12px;
  font-family:var(--f-display);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
}
.month-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.item{
  display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:6px 20px;align-items:start;
  padding:18px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;
}
.item:last-child{border-bottom:0}
.item .d{font-family:var(--f-mono);font-size:.8125rem;color:var(--muted);padding-top:5px}
.item .cat{display:block;margin-bottom:4px}
.item .ttl{
  margin:0 0 4px;font-family:var(--f-display);font-stretch:90%;font-weight:650;font-size:1.25rem;line-height:1.2;letter-spacing:-.005em;
  text-wrap:balance;transition:color .15s ease;
}
.item .dk{margin:0;font-size:1rem;line-height:1.45;color:var(--ink-2);max-width:62ch}
.item .tk{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:200px;padding-top:4px}
.item:hover .ttl{color:var(--accent-ink)}
.item:focus-visible{outline-offset:4px}
.empty{padding:48px 0;text-align:center;font-family:var(--f-display);color:var(--muted)}
.link-btn{border:0;background:none;padding:0;cursor:pointer;color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- Post ---------- */
.read{max-width:calc(var(--readw) + 2 * var(--gutter))}
.back{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:28px;
  font-family:var(--f-display);font-weight:600;font-size:.875rem;color:var(--muted);text-decoration:none;
}
.back:hover{color:var(--ink)}
.post-title{
  margin:14px 0 16px;font-family:var(--f-display);font-stretch:80%;font-weight:720;
  font-size:clamp(2.125rem,1.4rem + 3vw,3.375rem);line-height:1.03;letter-spacing:-.018em;text-wrap:balance;
}
.post-dek{margin:0 0 28px;font-size:1.3125rem;line-height:1.45;color:var(--ink-2);text-wrap:pretty}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:0 0 32px}
.spec{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;min-width:0}
.spec-head{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:12px 16px;
  background:var(--surface-2);border-bottom:1px solid var(--rule);
}
.spec-t{font-family:var(--f-mono);font-weight:600;font-size:.9375rem;color:var(--accent-ink);letter-spacing:.02em}
.spec-n{font-family:var(--f-display);font-weight:650;font-size:1rem;color:var(--ink)}
.spec-l{margin-left:auto;font-family:var(--f-display);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spec-rows{margin:0;padding:6px 16px 8px}
.spec-rows div{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px dotted var(--rule-2)}
.spec-rows div:last-child{border-bottom:0}
.spec-rows dt{font-family:var(--f-mono);font-size:.6875rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.spec-rows dd{margin:0;font-family:var(--f-display);font-size:.9375rem;line-height:1.4;color:var(--ink)}

.prose{font-size:1.1875rem;line-height:1.66;color:var(--ink)}
.prose > *{max-width:68ch}
.prose p{margin:0 0 1.05em}
.prose h3{
  margin:1.9em 0 .55em;font-family:var(--f-display);font-stretch:88%;font-weight:700;font-size:1.1875rem;line-height:1.25;letter-spacing:-.005em;
}
.prose h3:first-child{margin-top:0}
.prose strong{font-weight:600}
.prose ul,.prose ol{margin:0 0 1.15em;padding-left:1.4em}
.prose li{margin:0 0 .5em;padding-left:.2em}
.prose ul{list-style:none;padding-left:1.25em}
.prose ul li{position:relative}
.prose ul li::before{content:"";position:absolute;left:-1.05em;top:.62em;width:6px;height:6px;background:var(--accent);border-radius:1px}
.prose ol li::marker{font-family:var(--f-mono);font-size:.85em;color:var(--accent-ink)}
.post-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--rule)}
.post-foot .chips{margin-bottom:24px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{
  display:block;min-width:0;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);
  text-decoration:none;transition:border-color .15s ease;
}
.pager a:hover{border-color:var(--accent)}
.pager .dir{display:block;margin-bottom:4px}
.pager .pt{display:block;font-family:var(--f-display);font-weight:650;font-size:1rem;line-height:1.3;color:var(--ink)}
.pager .next{text-align:right;grid-column:2}

/* ---------- Portfolio ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:24px}
.page-title{margin:0;font-family:var(--f-display);font-stretch:80%;font-weight:720;font-size:clamp(2.125rem,1.5rem + 2.4vw,3rem);line-height:1;letter-spacing:-.018em}
.asof{margin:0;font-family:var(--f-display);font-size:.875rem;color:var(--muted)}
.kpi-strip{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:20px;
}
.tile{padding:18px 20px;border-left:1px solid var(--rule);min-width:0}
.tile:first-child{border-left:0}
.tile .label{display:block;margin-bottom:10px}
.tile .v{display:block;font-family:var(--f-display);font-weight:650;font-size:clamp(1.75rem,1.3rem + 1.4vw,2.375rem);line-height:1;letter-spacing:-.015em}
.tile .cap{display:block;margin-top:8px;font-family:var(--f-display);font-size:.8125rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:20px;margin-bottom:20px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
.card-title{margin:0;font-family:var(--f-display);font-stretch:88%;font-weight:700;font-size:1.25rem;letter-spacing:-.005em}
.card-sub{margin:4px 0 0;font-family:var(--f-display);font-size:.8125rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-family:var(--f-display);font-size:.8125rem;color:var(--ink-2)}
.legend li{display:inline-flex;align-items:center;gap:8px}
.key{display:inline-block;width:16px;height:2px;border-radius:1px}
.chart{position:relative;outline:none}
.chart:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--f-display)}
.tip{
  position:absolute;pointer-events:none;z-index:2;min-width:150px;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--radius);
  padding:10px 12px;font-family:var(--f-display);font-size:.8125rem;box-shadow:var(--shadow);
}
.tip .td{margin:0 0 6px;color:var(--muted);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tip .tr{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .tv{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;min-width:58px}
.tip .tl{color:var(--muted)}
.table-wrap{overflow-x:auto;margin-top:18px;border-top:1px solid var(--rule)}
table{border-collapse:collapse;width:100%}
.monthly{min-width:640px;font-family:var(--f-display);font-size:.8125rem}
.monthly th,.monthly td{padding:9px 8px;text-align:right;white-space:nowrap}
.monthly th{font-weight:600;color:var(--muted);font-size:.75rem;letter-spacing:.04em}
.monthly th:first-child,.monthly td:first-child{text-align:left;padding-left:0}
.monthly td{font-variant-numeric:tabular-nums;border-top:1px solid var(--rule)}
.monthly td:first-child{font-weight:600;color:var(--ink-2)}
.monthly .ytd{font-weight:650}
.monthly tr.main td{font-weight:650}

.alloc{display:grid;gap:4px}
.arow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 56px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.arow:last-child{border-bottom:0}
.aname{font-family:var(--f-display);font-weight:600;font-size:.9375rem;color:var(--ink);min-width:0}
.atk{display:block;margin-top:2px;font-family:var(--f-mono);font-size:.6875rem;color:var(--muted);letter-spacing:.02em}
.abar{height:10px;background:transparent;position:relative}
.abar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 3px 3px 0}
.arow.cash .abar i{background:var(--cash)}
.aval{font-family:var(--f-display);font-weight:650;font-size:.9375rem;text-align:right;font-variant-numeric:tabular-nums}

.hold-wrap{overflow-x:auto}
.holdings{font-family:var(--f-display);font-size:.875rem;min-width:560px}
.holdings th{
  text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--ink);
  font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;
}
.holdings th.r,.holdings td.r{text-align:right}
.holdings th button{border:0;background:none;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.holdings th button:hover,.holdings th button[aria-pressed="true"]{color:var(--ink)}
.holdings th button[aria-pressed="true"]::after{content:" \2193"}
.holdings td{padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.holdings tbody tr{cursor:pointer;transition:background .12s ease}
.holdings tbody tr:hover{background:var(--surface-2)}
.holdings tbody tr:hover .tkr{color:var(--accent-ink)}
.holdings tr.cashrow{cursor:default}
.holdings tr.cashrow:hover{background:transparent}
.tkr{font-family:var(--f-mono);font-weight:600;font-size:.8125rem;letter-spacing:.02em;color:var(--ink)}
.tkr a{text-decoration:none}
.co{color:var(--ink)}
.ly{color:var(--muted)}
.wcell{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.wbar{width:84px;height:6px;position:relative;flex:none}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 2px 2px 0}
.cashrow .wbar i{background:var(--cash)}
.ret{font-weight:650;font-variant-numeric:tabular-nums}
.note{margin:4px 0 0;font-family:var(--f-display);font-size:.8125rem;color:var(--muted);max-width:80ch}

/* ---------- Footer ---------- */
.site-foot{border-top:1px solid var(--rule)}
.foot-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding-block:22px 28px;font-family:var(--f-display);font-size:.8125rem;color:var(--muted)}
.foot-row strong{color:var(--ink-2);font-weight:650}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .lead{grid-template-columns:1fr;gap:28px}
  .kpi-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile:nth-child(3){border-left:0}

var POSTS_A = [
{
  id:"p-2026-03-18-start", date:"2026-03-18", cat:"portfolio", tickers:[],
  title:"Starting this journal",
  dek:"Why I'm writing down my reasoning, and the rules I'll hold myself to.",
  body:`<p>This journal is a record of why I make each investment decision, written before I know how it turns out. Looking back, I want to see whether I was right for the right reasons.</p>
<p>The idea behind the account is simple. The biggest spending wave in tech is the buildout of computing for AI: chips, memory, networking, power and cooling. I don't know which AI model or app will win, and I don't need to. They all run on the same hardware, so that's what I own.</p>
<p>The account has three parts:</p>
<ul><li><strong>Core positions</strong> in companies that sit on a real bottleneck in that supply chain.</li><li><strong>Small speculative bets</strong> that can pay off big and cost little if they fail.</li><li><strong>A cash reserve</strong>, because the best prices usually show up on bad days.</li></ul>
<p>Three rules for this journal. Every number is a percentage: position sizes are a share of the account, and results are gains or losses against cost. I'll post once or twice a week. And when a thesis breaks, I write that post too.</p>
<p>None of this is advice. It's a notebook I'm keeping in public so I can't quietly rewrite it later.</p>`
},
{
  id:"p-2026-03-21-aaoi", date:"2026-03-21", cat:"stock", tickers:["AAOI"],
  title:"Why I bought AAOI",
  dek:"A small optics maker with its own lasers, riding the data center upgrade cycle.",
  spec:[{t:"AAOI", name:"Applied Optoelectronics", layer:"Optics", does:"Optical transceivers and the lasers inside them", move:"Bought Mar 20", watch:"Orders from the big cloud customers"}],
  body:`<p>Applied Optoelectronics makes optical transceivers, the parts that turn electrical signals into light so data can move over fiber between servers and switches. Past a few meters, almost everything in a data center travels as light, and every link needs a transceiver at each end.</p>
<p>AI multiplies the number of links. In a training cluster, thousands of chips trade data constantly, so the network becomes part of the computer. That's why networking keeps taking a bigger share of data center budgets, and why speeds keep jumping from 400G to 800G to 1.6T. Each jump forces buyers to replace modules. More volume plus a replacement cycle is a strong setup.</p>
<p>AAOI is small, which is both the appeal and the risk. It makes its own lasers, the scarcest part of a transceiver. It has US factories at a time when buyers care where parts come from. A few big design wins would change its numbers a lot.</p>
<p>The risks are real. A couple of customers make up most of its sales, prices fall with every product generation, and the stock has gone nowhere for long stretches before. There is no moat here, only a window.</p>
<p>I bought a first lot this week and plan to add on weakness. If orders stall for two straight quarters, I'm out.</p>`
},
{
  id:"p-2026-03-27-data-center-map", date:"2026-03-27", cat:"research", tickers:[],
  title:"Where the money goes in an AI data center",
  dek:"A rough map of the spending, and why the bottleneck keeps moving.",
  body:`<p>Before adding more positions, I wanted a map of where the money goes when someone builds an AI data center.</p>
<p>Roughly: the AI chips are the biggest line, about half or more of the equipment bill. Next is high-bandwidth memory, which ships with the chips but comes from a separate industry. Then networking: switches, cables and optical modules. Then storage. Then the building itself, with power gear, transformers and cooling.</p>
<p>The useful pattern is that <strong>the bottleneck keeps moving</strong>. Whatever is scarce collects the profits. Money rushes in, capacity gets built, and the shortage moves to the next layer. First it was the chips, then advanced packaging, then memory. The next candidates look like optics and electrical power. The best trade is usually the next bottleneck, not the last one.</p>
<p>Margins follow industry structure. Layers with two or three real suppliers keep pricing power. Layers with ten suppliers hand the value to their customers. When I size a position, structure matters as much as growth.</p>
<p>So the plan is to own several layers instead of one, lean toward where the bottleneck is heading, and rotate as each shortage clears. It's also where this journal's name comes from.</p>`
},
{
  id:"p-2026-03-30-three-buys", date:"2026-03-30", cat:"portfolio", tickers:["ALAB","IREN","CRWV"],
  title:"Three buys: ALAB, IREN and CRWV",
  dek:"Putting new cash to work after a pullback.",
  body:`<p>I put a good chunk of cash to work today across three names, using new money I added to the account this month. Each gets its own post soon. This one covers why I bought them together and how I sized them.</p>
<p>The reason was price. All three had pulled back into the entry ranges I wrote down in advance. When a price reaches the plan, I buy. I want buying to feel mechanical, because the days when good companies are cheap are the days buying feels worst.</p>
<p>The three ideas are related but different:</p>
<ul><li><strong>Astera Labs</strong> is a bet that every AI server needs more connectivity chips each generation, whoever makes the processor.</li><li><strong>IREN</strong> is a bet that access to electricity becomes the scarce thing.</li><li><strong>CoreWeave</strong> is a bet that demand to rent AI computing stays ahead of supply.</li></ul>
<p>Astera is the core position because its business quality is the highest. The other two stay smaller because they carry debt and execution risk. Even after today, about a third of the account is cash.</p>
<p>What would make today a mistake is a real slowdown in AI spending: actual budget cuts from the big builders, rather than a scary headline.</p>`
},
{
  id:"p-2026-04-03-alab", date:"2026-04-03", cat:"stock", tickers:["ALAB"],
  title:"Why I added to ALAB",
  dek:"More connectivity chips in every AI server, whoever wins the processor race.",
  spec:[{t:"ALAB", name:"Astera Labs", layer:"Chips & networking", does:"Connectivity chips inside AI servers", move:"Added Mar 30", watch:"Attach rates on new AI platforms"}],
  body:`<p>Astera Labs designs connectivity chips for AI servers. Its main product is the retimer. As data speeds climb, electrical signals degrade over shorter distances, so past a few inches of circuit board they have to be cleaned up and resent. Modern AI servers don't work without them.</p>
<p>What I like most is content per server. Every new chip generation runs faster links, and more of them, so each board needs more of Astera's parts. It has also added switches that connect AI chips to each other and controllers for new memory standards. And it's neutral: it sells into every chip vendor's ecosystem, so I don't have to guess which AI chip wins.</p>
<p>The business looks like a good chip designer should. It has no factories, high margins, and deep work with the biggest cloud companies while they design their systems. Once its parts are designed in, they usually stay for the whole generation.</p>
<p>The risks: a short customer list, a much larger competitor that would happily absorb this function, and a valuation that swings hard on any AI news.</p>
<p>I started the position in February and added on Monday's dip at a much lower price. It is now one of my largest holdings.</p>`
},
{
  id:"p-2026-04-08-crwv", date:"2026-04-08", cat:"stock", tickers:["CRWV"],
  title:"Why I own CRWV",
  dek:"An AI cloud built on contracts, and a balance sheet built on debt.",
  spec:[{t:"CRWV", name:"CoreWeave", layer:"Compute & sites", does:"Rents out AI computing on multi-year contracts", move:"Added Mar 30", watch:"New contracts vs. new debt"}],
  body:`<p>CoreWeave buys AI chips in bulk, builds them into data centers, and rents the computing to companies training or running large models. It's a direct bet on one imbalance: demand for ready-to-use AI computing keeps running ahead of supply, and building your own takes years.</p>
<p>The contracts make this a business. Most capacity is sold on multi-year commitments signed with large AI labs before or while the hardware goes in. When CoreWeave borrows to buy chips, it borrows against signed contracts.</p>
<p>The balance sheet is the whole debate. The chips are bought with debt, and they lose value as new generations arrive. The bear case says the chips age faster than the loans get paid down, and if computing stops being scarce, prices collapse onto a pile of debt. The bull case says older chips keep earning on smaller workloads for years. Both make sense.</p>
<p>The other risk is concentration: a few customers make up most of the revenue.</p>
<p>I hold two lots, one from the winter and one added on last week's dip. It stays mid-sized because the debt does my sizing for me. My scorecard: are new contracts growing faster than new debt?</p>`
},
{
  id:"p-2026-04-11-iren", date:"2026-04-11", cat:"stock", tickers:["IREN"],
  title:"Why I averaged down on IREN",
  dek:"A bitcoin miner's power sites may be worth more as AI data centers.",
  spec:[{t:"IREN", name:"IREN", layer:"Compute & sites", does:"Power-ready sites moving from bitcoin mining to AI cloud", move:"Added Mar 30", watch:"Signed AI contracts with named customers"}],
  body:`<p>IREN started as a bitcoin miner, and for many investors the analysis stops there. I think the market's discount is aimed at the company's history instead of its assets.</p>
<p>To mine, IREN built large sites with cheap renewable power, secured grid connections, and land permitted for heavy electrical load. Grid connections take years to get. If the limit on AI is shifting from chips to electricity, an energized site with hundreds of megawatts is the scarce asset, and here it sits inside a company priced like a crypto stock.</p>
<p>The plan is to point those megawatts at AI computing. The difference in revenue quality is huge: mining income depends on a coin price, while AI computing can be sold on contracts. Every megawatt that moves from one bucket to the other deserves a higher valuation.</p>
<p>The uncomfortable part is that my first lot from last fall is deep underwater, and last week I bought a larger lot at a much lower price. Averaging down is how small accounts blow up, so my rule is that it's only allowed when the thesis has improved. I think it has. Power scarcity has become the builders' own talking point, and IREN's data center plans have gotten concrete.</p>
<p>It stays mid-sized until real AI contracts with named customers show up.</p>`
},
{
  id:"p-2026-04-15-memory", date:"2026-04-15", cat:"research", tickers:["MU","SNDK"],
  title:"How the memory industry works",
  dek:"Three makers, a new kind of chip, and why AI tightens the whole market.",
  body:`<p>This is background for the two memory positions I've held since last fall. Memory is the part of the AI stack the market keeps underestimating.</p>
<h3>DRAM: three survivors</h3>
<p>DRAM used to be made by dozens of companies. Decades of price wars killed or merged almost all of them. Three are left: Samsung, SK Hynix and Micron. In recent cycles they've cut supply quickly when prices fall instead of chasing market share. That discipline is new, and I don't think the market fully prices it.</p>
<h3>HBM: the growth engine</h3>
<p>High-bandwidth memory stacks DRAM chips vertically and sits right next to the AI processor, because AI chips need data faster than normal memory can deliver it. HBM is hard to make and slow to qualify. It also uses about three times the factory capacity per bit of normal DRAM. Every wafer moved to HBM is supply removed from the regular market, so AI demand tightens the whole memory market.</p>
<h3>NAND: the rougher cousin</h3>
<p>Flash storage has more producers and deeper crashes. But the same consolidation has been grinding forward, and AI adds a new buyer: training data and AI output are pushing data centers toward flash.</p>
<p>What I do with this: hold a DRAM and HBM maker and a flash maker through the up-cycle, and never forget what they are. These are cyclical stocks in growth costumes. The exit plan gets written on the way up, when everyone agrees the cycle is permanent.</p>`
},
{
  id:"p-2026-04-18-check-in", date:"2026-04-18", cat:"portfolio", tickers:[],
  title:"Portfolio check-in",
  dek:"A month in: how the account is split, and the risk I'm choosing to take.",
  body:`<p>A month into this journal, here is the shape of the account.</p>
<ul><li><strong>Optics and connectivity</strong> is the largest group at about a third of the account. AAOI is up about two-thirds since March and is now my biggest position.</li><li><strong>Compute and power</strong> is about a fifth: CoreWeave, IREN and a small nuclear position, NuScale, that I haven't written up yet.</li><li><strong>Memory</strong> is about 15%, in two positions from last fall. Sandisk is up more than fourfold from my cost, and Micron has nearly doubled.</li><li><strong>Outside AI</strong> is about 8%: antimony miner UAMY and drone maker Ondas.</li><li><strong>Cash</strong> is just under a quarter.</li></ul>
<p>Winners resize a portfolio without asking. AAOI was already a big bet, and four weeks of gains made it a fifth of the account. For now I'm letting it run, but I've started writing rules for when trimming stops being optional.</p>
<p>The risk check: almost everything here is one correlated bet. If AI spending pauses, nearly all of it falls together, and the small diversifiers won't save it. I accept that. The cash is the counterweight.</p>
<p>One discipline test: can I say in two sentences why I own each position and what would make me sell it? Today the answer is yes for all but one. That one gets researched or sold by the end of the month.</p>`
},
{
  id:"p-2026-04-24-mu", date:"2026-04-24", cat:"stock", tickers:["MU"],
  title:"Why I own MU",
  dek:"A famously cyclical company with a structural reason this cycle could run longer.",
  spec:[{t:"MU", name:"Micron Technology", layer:"Memory & storage", does:"One of three DRAM makers; also makes flash", move:"Holding since fall 2025", watch:"HBM pricing and new supply"}],
  body:`<p>Micron is one of the three DRAM makers left, and a top flash maker too. For most of its history that made it a violent cyclical: you rented the stock for a year and a half and gave it back before the crash. My position from last fall is a bet that this cycle is different for structural reasons.</p>
<p>The first is high-bandwidth memory. Micron fought its way into the top AI platforms, and demand is so strong that supply is committed far ahead. HBM sells less like a commodity and more like a design win: qualified early, priced on value, and tied to the customer's roadmap.</p>
<p>The second is the factory math from my memory post. HBM uses about three times the capacity per bit, so the shift to HBM drains supply from the regular market while makers spend on converting capacity instead of adding it. Tight supply in normal memory plus premium prices in HBM is what makes memory makers very profitable.</p>
<p>What can break it is the cycle itself. If AI chip demand pauses, HBM orders get hit first, and this new discipline has never faced a real demand shock. Chinese producers are also adding capacity in older products.</p>
<p>My lot from last fall has roughly doubled, even after I sold some in January. It stays core for now, but it's first in line for the trimming rules I owe this journal.</p>`
},
{
  id:"p-2026-05-01-sndk", date:"2026-05-01", cat:"stock", tickers:["SNDK"],
  title:"Why I own SNDK",
  dek:"A neglected spin-off meets the first AI-driven flash cycle.",
  spec:[{t:"SNDK", name:"Sandisk", layer:"Memory & storage", does:"Flash memory and data center SSDs", move:"Holding since fall 2025", watch:"Flash prices and data center demand"}],
  body:`<p>Sandisk returned to the public market in early 2025, spun off from Western Digital. Spin-offs are an old pattern for a mechanical reason: the shares land with holders who never chose them, index funds sell what doesn't fit, and few analysts cover the stock. When I bought last fall, that neglect was half the thesis.</p>
<p>The other half is the flash cycle. NAND has been the most self-destructive corner of the chip industry, but the version that came out of the last downturn is consolidated and has held its discipline. Sandisk has real scale through its long-running manufacturing joint venture with Kioxia, which splits the huge factory costs.</p>
<p>Then AI showed up as a new storage buyer. Training data, model checkpoints and AI output all land in data centers that increasingly want flash instead of spinning disks. A disciplined market plus a new structural buyer is the DRAM story one industry over, with less attention.</p>
<p>To be clear about what this is: a cyclical. When NAND turns, it crashes, and no AI story changes the math of oversupply.</p>
<p>It's the best trade in the account, up about five times from my cost even after sales in January and February. The plan, written down now: sell in stages into strength. Cyclicals reward the people who leave early.</p>`
},
{
  id:"p-2026-05-08-power", date:"2026-05-08", cat:"research", tickers:[],
  title:"Power is becoming the limit",
  dek:"Why electricity, not chips, may be the next bottleneck.",
  body:`<p>Every research thread I pull lately ends at the same wall: electricity. Generating it, moving it, and getting permission to connect to it.</p>
<p>Start with scale. New AI campuses are planned in gigawatts, a unit that used to belong to cities. One large campus can need the output of a full power plant. Meanwhile, a new grid connection in the US can take years. You can build a chip in months, but you can't rush a substation approval.</p>
<p>The builders' behavior proves the point. They're signing long-term deals with nuclear plants, paying to restart closed ones, generating power on site to skip the grid queue, and choosing locations by available power first. This spring's energy shock from the Iran war only raised the value of power that's secured and local.</p>
<p>Inside the building, the same pressure shows up as heat. Racks are too dense for air cooling, so the industry is moving to liquid cooling piped straight to the chips. That adds new equipment to every site. Transformers and switchgear now have long lead times too.</p>
<p>So I want the account's power exposure to be deliberate instead of accidental. The shortlist: an equipment maker that sells the electrical and cooling gear inside data centers, more generation exposure, and the power-site company I already own. The next buys follow the electricity.</p>`
},
{
  id:"p-2026-05-14-smr", date:"2026-05-14", cat:"stock", tickers:["SMR"],
  title:"Why I own SMR",
  dek:"The first approved small reactor design, and a long wait for revenue.",
  spec:[{t:"SMR", name:"NuScale Power", layer:"Power & cooling", does:"Small modular nuclear reactors", move:"Holding since January", watch:"A firm order from a named US customer"}],
  body:`<p>NuScale wants to shrink nuclear plants into factory-built modules that can be produced in series instead of built as one-off megaprojects. The pitch is that nuclear's problem was never the physics. It was construction.</p>
<p>Its most valuable asset is regulatory. It holds the first small modular reactor design approved by the US Nuclear Regulatory Commission, a process that takes years. Its scars explain the low price: its flagship US project was cancelled in 2023 after costs pushed the projected power price too high.</p>
<p>What changed is demand. AI campuses need steady, clean, around-the-clock power. Wind and solar can't do it alone, and gas clashes with the buyers' carbon goals. Nuclear checks every box, and big tech has shown it will sign long contracts and pay a premium for firm clean power.</p>
<p>Every risk here is the same risk: time. Real reactor revenue is years away, the company burns cash while it waits, and first-of-a-kind projects are where nuclear plans usually die.</p>
<p>So it's one of my smallest positions. I need a firm order from a named North American customer within a reasonable window. Without one, patience becomes an excuse.</p>`
},
{
  id:"p-2026-05-21-uamy", date:"2026-05-21", cat:"stock", tickers:["UAMY"],
  title:"Why I own UAMY",
  dek:"A tiny miner that is most of America's antimony supply.",
  spec:[{t:"UAMY", name:"United States Antimony", layer:"Defense, space & minerals", does:"The only integrated US antimony producer", move:"Holding; sold half in February", watch:"Antimony prices and China's export rules"}],
  body:`<p>This is the strangest position in the account: the only meaningful American producer of antimony, a metal most investors couldn't place on a periodic table.</p>
<p>Antimony hardens lead in ammunition, goes into flame retardants, strengthens alloys and batteries, and clarifies the glass in solar panels. None of those uses has an easy substitute, so when supply breaks, price does the adjusting.</p>
<p>Supply broke in late 2024, when China, which dominates mining and processing, banned antimony exports to the US. Prices went vertical. China suspended the ban last November as part of the trade truce, but every shipment still needs a license from Beijing, and the suspension runs out this November. Defense planners now know a key input for ammunition runs through a rival.</p>
<p>UAMY owns the scarce thing: US mining and, just as important, US processing. In a market this small, a company this small is the whole American supply story. That cuts both ways. Expanding production is slow and expensive, and revenue depends on a commodity price that can fall as fast as it rose.</p>
<p>Its job in an AI-heavy account is to move on different news: geopolitics and munitions instead of data centers. I sold half in February. The rest is up about 40% from my cost.</p>`
},
{
  id:"p-2026-05-28-selling-rules", date:"2026-05-28", cat:"portfolio", tickers:[],
  title:"My rules for selling",
  dek:"Written down in calm, before any order goes in.",
  body:`<p>My winners have grown into position sizes I never chose. Astera Labs is now about a fifth of the account and AAOI about a sixth. Size earned by price isn't the same as size earned by conviction, so here are my selling rules, written before any order goes in.</p>
<p><strong>1. Size.</strong> When a position grows well past its target weight, the excess gets trimmed back to target. The thesis can be fully intact and the trim still happens.</p>
<p><strong>2. Consensus.</strong> Every position was bought on a view the market didn't share. When that view becomes consensus, the edge is spent, even if the business keeps doing well. This matters most for cyclicals.</p>
<p><strong>3. Better use.</strong> Money belongs where it's treated best. If fresher ideas offer more upside, funding them from stretched winners is the job.</p>
<p><strong>4. Broken thesis.</strong> Sold immediately and completely, at any price. None of the other rules apply.</p>
<p>The plan is a staged rotation over the coming weeks: trim the biggest winners toward target, exit names that haven't earned their place, and move toward power, cooling and a few new ideas. Cash will rise before it falls.</p>`
},
{
  id:"p-2026-06-05-rebalance", date:"2026-06-05", cat:"portfolio", tickers:["VRT","MRVL","PL","OSS","POET","SMR"],
  title:"June rebalance",
  dek:"Trimming the winners, closing NuScale, and five new positions.",
  body:`<p>The rotation I planned last week happened today. Here's what moved, checked against the rules.</p>
<h3>Sold</h3>
<ul><li><strong>NuScale, closed</strong> at a loss of about 44%, under rule 3. The thesis didn't break, but the firm US order I asked for hasn't come, and the money has nearer-term uses.</li><li><strong>Trims</strong> of Micron, Sandisk, Astera Labs and AAOI, back toward target weights under rule 1. Each sold something up a lot from cost, which is exactly when selling feels worst.</li></ul>
<h3>Bought</h3>
<ul><li><strong>Vertiv</strong>, power and cooling equipment, sized toward core.</li><li><strong>Marvell</strong>, custom AI chips and optics, to balance my tilt toward small companies.</li><li><strong>Planet Labs</strong>, satellite imaging, my first space position.</li><li><strong>One Stop Systems</strong> and <strong>POET</strong>, two small speculative bets.</li></ul>
<p>The net effect: less concentration in names that already won, more exposure to power, cooling and data, and an account back in its intended shape. More trims are likely over the next few days as remaining orders work.</p>
<p>A note for later grading: today's sales locked in gains on ideas that worked. Whether the new buys work can't be judged for months.</p>`
},
{
  id:"p-2026-06-10-mrvl", date:"2026-06-10", cat:"stock", tickers:["MRVL"],
  title:"Why I bought MRVL",
  dek:"Two AI businesses in one company, at a lagging price.",
  spec:[{t:"MRVL", name:"Marvell Technology", layer:"Chips & networking", does:"Custom AI chips for cloud companies, plus optical chips", move:"Bought Jun 5", watch:"Custom-chip wins and ramp timing"}],
  body:`<p>Marvell has two separate AI businesses in one company, at a price that has lagged the famous names in each.</p>
<p><strong>Custom chips.</strong> The largest cloud companies don't want to buy every AI chip from one vendor, so each is designing its own. A cutting-edge chip needs skills few companies have: advanced packaging, high-speed interconnect, and close ties to the top foundries. Marvell is one of only a couple of design partners that can do this at scale, and custom silicon is its fastest-growing business.</p>
<p><strong>Optics.</strong> Marvell leads in the signal processors inside high-speed optical modules, the electronic brains of each link. My AAOI post covered why transceiver volumes are booming. Marvell collects on the same boom one layer up, where there are fewer competitors and better margins.</p>
<p>The risks: custom-chip revenue is lumpy and fought over every generation, losing one big program would leave a visible hole, and its main rival is much bigger. The stock is only cheap compared with the AI leaders.</p>
<p>I opened near core size, with room to add if the custom programs deliver. In an account full of small companies betting on one product, a large company with two ways to win adds stability.</p>`
},
{
  id:"p-2026-06-13-vrt", date:"2026-06-13", cat:"stock", tickers:["VRT"],
  title:"Why I bought VRT",
  dek:"The most direct way to own the power and cooling buildout.",
  spec:[{t:"VRT", name:"Vertiv", layer:"Power & cooling", does:"Power and cooling equipment for data centers", move:"Bought Jun 5", watch:"Orders and backlog"}],
  body:`<p>Vertiv is the most direct way to own the power thesis. It sells the electrical and cooling systems inside data centers: power distribution, backup power, switchgear, and everything from room air handlers to liquid cooling piped to the chips.</p>
<p>Liquid cooling is the growth engine. AI racks now draw more power than air can cool, and the industry is converting fast. For Vertiv that's added revenue on top of what it already sells: coolant distribution units, piping and heat rejection are products the air-cooled world never needed. Revenue per data center goes up, on new builds and on upgrades.</p>
<p>The quieter strengths matter too. A large installed base produces service revenue through any cycle. Its gear is written into the standard designs that contractors and cloud companies use. And it's neutral: whoever wins the chip race needs power delivered and heat removed.</p>
<p>The risks: orders track construction schedules, so any pause in the buildout hits bookings. The stock has already run a lot, so it assumes continued growth. And large electrical conglomerates are always competing.</p>
<p>I sized it toward core. This is the position I expect to hold longest and think about least.</p>`
},
{
  id:"p-2026-06-17-pl", date:"2026-06-17", cat:"stock", tickers:["PL"],
  title:"Why I bought PL",
  dek:"An archive of daily satellite images that AI can finally read.",
  spec:[{t:"PL", name:"Planet Labs", layer:"Defense, space & minerals", does:"Satellites that image Earth's land every day", move:"Bought Jun 5, trimmed Jun 8", watch:"Profitable growth in government work"}],
  body:`<p>Planet Labs runs the largest fleet of Earth-imaging satellites, enough to photograph nearly all of the planet's land every day. The real product is the dataset: a daily, years-deep picture of everything happening outside. Nobody can recreate that archive, because you can't go back and photograph the past.</p>
<p>Demand has two engines. <strong>Defense and intelligence</strong> budgets are rising, satellite imagery has proven itself in every recent conflict, and Planet has been signing bigger multi-year government contracts. <strong>AI</strong> is the second engine. A daily photo of the world used to be useless if no one could look at all of it. Vision models remove that limit: they can count ships, track construction and flag change across the whole archive.</p>
<p>The other side: Planet has spent its public life promising profitability, with more share dilution than delivery. Government sales are slow and lumpy, and each new satellite generation adds execution risk.</p>
<p>I bought three pieces on rebalance day after a sharp drop from its May high, then trimmed about a quarter of it the next trading day to keep it inside the speculative tier. It's already below my cost. The milestone I'm holding it to is steady, profitable growth in government work.</p>`
},
{
  id:"p-2026-06-20-oss-poet", date:"2026-06-20", cat:"stock", tickers:["OSS","POET"],
  title:"Two small bets: OSS and POET",
  dek:"The speculative end of the account, sized so being wrong is cheap.",
  spec:[{t:"OSS", name:"One Stop Systems", layer:"Defense, space & minerals", does:"Rugged AI computers for vehicles and field sites", move:"Bought Jun 5", watch:"Program wins turning into shipments"},{t:"POET", name:"POET Technologies", layer:"Optics", does:"Chip-style manufacturing for optical parts", move:"Bought Jun 5", watch:"A volume design win"}],
  body:`<p>These two play the same role: the speculative end of the account. Each is a small company in an overlooked corner of the buildout, priced for doubt, and each could double or halve without surprising anyone. Being wrong on both costs little. Being right on either pays for the pair.</p>
<p><strong>One Stop Systems</strong> builds rugged high-performance computers: AI-class hardware made to survive vehicles, aircraft, ships and field sites. The idea is that AI moves to where decisions happen, and autonomous and defense systems can't wait on a distant data center. Defense budgets drive demand, and won programs run for years. The risks are classic for a small defense supplier: lumpy orders and slow procurement.</p>
<p><strong>POET Technologies</strong> is the more speculative one. It has spent years developing a way to assemble optical components on a wafer, using chip-style manufacturing instead of costly manual assembly. If it gets designed in at scale, the cost advantage is big. But revenue is early, the cash comes from selling stock, and photonics history is full of elegant technology that never reached volume.</p>
<p>Neither gets averaged down, so a speculative bet can never grow into a large one through stubbornness. Silence through year-end earns an exit.</p>`
},
{
  id:"p-2026-06-26-selling-notes", date:"2026-06-26", cat:"portfolio", tickers:["SNDK","ONDS"],
  title:"Notes on selling",
  dek:"Three weeks of selling, and what it felt like.",
  body:`<p>Investment writing is mostly about buying. Selling gets a fraction of the attention and decides most of the outcome. I've done more selling in the past three weeks than ever before, so here's what it was like.</p>
<p>The mechanics: I sold in waves from rebalance day through mid-June, mostly deep trims of the big winners. Sandisk is still nearly ten times my cost even after the sales. I also closed Ondas, a small drone position from January, at about a 15% loss. It never earned a write-up, which told me something. Cash is now a bit over a third of the account, the most since this journal started.</p>
<p>The psychology is where discipline lives or dies. Every trim felt like a mistake when I placed it. The stocks had been good to me, the story was everywhere, and some kept rising after I sold. That's what the selling rules are for. A trim manages position size, and a stock rising after a partial sale doesn't prove the trim was wrong. About half of all trims will look early.</p>
<p>Taxes, kept general: active trading in a taxable account gives up a real slice of gains to short-term rates. I accept that, because holding oversized positions to improve a tax bill lets the tail wag the dog.</p>
<p>What's left is an account I can defend line by line: core positions in strong businesses, speculative bets sized like bets, and enough cash to buy the next red week.</p>`
},
{
  id:"p-2026-07-03-half-year", date:"2026-07-03", cat:"portfolio", tickers:[],
  title:"Half-year review",
  dek:"The account more than doubled in six months. Here's what did it.",
  body:`<p>Six months are done. Percentages only, but here's everything.</p>
<h3>The headline</h3>
<p>The account rose about 116% in the first half, measured on a time-weighted basis so the cash I added in March doesn't inflate it. The S&amp;P 500 rose about 10% and the semiconductor ETF (SMH) about 82%. Cash ended June at about 36% of the account.</p>
<h3>Winners</h3>
<p>Sandisk is my trade of the year, up roughly 950% from my fall cost even after four rounds of selling. Micron is up about 380% and Astera Labs about 365%. Behind them: AAOI +48%, CoreWeave +26%, UAMY +25%, Vertiv +13%, One Stop +10%, Marvell +9% and IREN +6%.</p>
<p>IREN hides a lesson. The spring lot is up about 36%, while last fall's lot was sold at a loss. Averaging into an improved thesis worked this time. It could just as easily have doubled a mistake.</p>
<h3>Losers</h3>
<p>NuScale (−44%) and Ondas (−15%) were closed in June. POET is down 13% and Planet Labs is about flat. The June buys are too new to grade.</p>
<h3>Lessons</h3>
<ul><li>Nearly everything that worked was one bet on AI hardware. These results measure a theme more than a skill.</li><li>The structure worked: core positions compounded and the speculative ones stayed small.</li><li>Selling is still my weakest muscle. Every trim happened on schedule and every one felt wrong, so the rules should stay strict.</li></ul>
<h3>Already in July</h3>
<p>The second half started badly. Chip stocks fell hard on July 1 and 2, and the account lost about 9% in two days. I have plenty of cash, and this is the kind of drop I keep it for.</p>`
}
