{
  id:"p-2026-07-07-back-in", date:"2026-07-07", cat:"portfolio", tickers:["AAOI","MRVL","BE"],
  title:"Back in: AAOI, Marvell and Bloom Energy",
  dek:"The first buys of the second half, made into a falling market.",
  body:`<p>Chip stocks have fallen for most of the past week. Since June 30 the semiconductor ETF is down about 11%, and so is my account. Today I spent about 40% of my cash.</p>
<ul><li><strong>AAOI.</strong> I bought back in at about 38% below the average price I sold at in June. Nothing in the business has changed. The stock got cut along with everything else that ran.</li><li><strong>Marvell.</strong> Added at about 18% below my first lot from June 5, bringing it toward full size.</li><li><strong>Bloom Energy</strong>, a new position: fuel cells that generate power on site at data centers. It's about 22% below its June high. Full post on Friday.</li></ul>
<p>Why now: these were the names on my list, and their prices reached the levels I wrote down. Buying into a falling market feels bad, which is usually a sign the price is better.</p>
<p>The new risk is outside the chip world. The US and Iran traded strikes again today, the first serious fighting since the June agreement, and oil jumped. Higher oil means stickier inflation, which makes a Fed rate hike more likely, and expensive growth stocks are the first thing investors sell on that.</p>
<p>Cash is now about a quarter of the account. If prices keep falling I'll keep buying in steps, not all at once.</p>`
},
{
  id:"p-2026-07-10-be", date:"2026-07-10", cat:"stock", tickers:["BE"],
  title:"Why I bought BE",
  dek:"Fuel cells that let a data center skip the line for grid power.",
  spec:[{t:"BE", name:"Bloom Energy", layer:"Power & cooling", does:"Fuel cells that generate electricity on site", move:"Bought Jul 7", watch:"Data center orders and full-year guidance"}],
  body:`<p>Bloom Energy makes solid oxide fuel cells: boxes that turn natural gas into electricity through a chemical reaction instead of burning it. For data centers, the selling point is speed. A grid connection can take years, and new gas turbines have long waitlists. Bloom says it can deliver and install power in months.</p>
<p>That's the bottleneck from my power post. The builders' constraint is shifting from chips to getting electricity to a site fast enough. Bloom lets a data center skip the queue and run on its own power, then keep the fuel cells as backup once the grid arrives.</p>
<p>The deals are getting big. Oracle uses Bloom to power its data centers, the utility AEP signed for up to 1 gigawatt, and Brookfield committed up to $5 billion to deploy Bloom systems at AI sites. A few years ago this was a niche clean-energy company. Now it's part of the AI power supply chain.</p>
<p>The risks: fuel cells cost more per unit of power than the grid, and they still run on natural gas, so gas prices matter. The stock is extremely volatile. It was already about 22% below its June high when I bought, and it has fallen another 9% since Tuesday.</p>
<p>I sized it as a mid-sized position. The second-quarter report at the end of July will show whether demand is turning into revenue.</p>`
},
{
  id:"p-2026-07-14-wulf", date:"2026-07-14", cat:"stock", tickers:["WULF"],
  title:"Why I bought WULF",
  dek:"A former bitcoin miner with a 20-year lease from Anthropic.",
  spec:[{t:"WULF", name:"TeraWulf", layer:"Compute & sites", does:"Builds and leases power-ready data centers", move:"Bought Jul 13", watch:"The Kentucky campus staying on schedule"}],
  body:`<p>TeraWulf runs the same playbook as IREN: a bitcoin miner with power-ready land, turning itself into a landlord for AI computing. The difference is that TeraWulf already has the big contract.</p>
<p>Last week it signed a 20-year lease with Anthropic for about 400 megawatts at a new campus in Kentucky. The lease is worth roughly $19 billion over its first term, and more if Anthropic extends it. Delivery starts in the second half of 2027. At its New York campus, TeraWulf already hosts AI capacity for Fluidstack, with Google backing those leases.</p>
<p>I like the structure. A 20-year lease with one of the top AI labs looks more like infrastructure than a tech bet. Once the building is delivered, TeraWulf collects rent whether AI models get cheaper or not. That's the kind of revenue a former miner gets re-rated on.</p>
<p>The risks are about getting there. Building 400 megawatts takes enormous amounts of money, so I expect heavy borrowing and new shares. Construction delays would push revenue out. And one tenant is a lot of concentration.</p>
<p>I bought yesterday, a week after the announcement, once the excitement had faded. The milestone is simple: the Kentucky campus on schedule.</p>`
},
{
  id:"p-2026-07-17-axti", date:"2026-07-17", cat:"stock", tickers:["AXTI","AAOI"],
  title:"Why I bought AXTI",
  dek:"The wafer underneath every optical laser, made in a country that controls its exports.",
  spec:[{t:"AXTI", name:"AXT Inc", layer:"Optics", does:"Indium phosphide wafers, the base material for optical lasers", move:"Bought Jul 13 and Jul 16", watch:"China export permits and indium phosphide sales"}],
  body:`<p>If optics is the next bottleneck in AI, indium phosphide is the bottleneck inside it. The lasers in high-speed optical transceivers are built on indium phosphide wafers, and only a handful of companies make them. AXT is one of the largest.</p>
<p>This sits one layer below AAOI. Every 800G and 1.6T module that AAOI, Lumentum or Coherent ships needs lasers, and every laser starts as a slice of one of these wafers. Demand is rising faster than capacity, and AXT's sales are climbing with it.</p>
<p>The catch is geography. AXT makes its wafers in China, and China put indium phosphide on its export-control list last year, so every overseas order needs a permit. Permits for Europe and Japan have come through, and US shipments still depend on approvals. A policy change in Beijing could cut off much of the business overnight.</p>
<p>That risk, along with a large share sale in April and insider selling, is why the stock has fallen about two-thirds since May. I think the price now reflects the risk more than the opportunity.</p>
<p>I bought on Monday and added yesterday after another drop. I also added to AAOI on Wednesday. Optics is now my biggest group at about 30% of the account, and cash is down to about 4%. That's faster than I said I'd go on July 7. AXT reports in two weeks, and that report matters more than usual.</p>`
},
{
  id:"p-2026-07-22-chip-selloff", date:"2026-07-22", cat:"markets", tickers:["MU","SNDK","SKHY"],
  title:"What's behind the chip selloff",
  dek:"Five reasons chip stocks have fallen, and which ones I think matter.",
  body:`<p>The semiconductor ETF is down about 12% from its June 22 peak. Memory has been hit harder: Micron is down about 21% and Sandisk about 32%. My account is down about 16% since June 30, after a rough week and a partial bounce. Here's what I think is going on.</p>
<ol><li><strong>Profit-taking.</strong> Memory and optics just had one of their best half-years ever, and a lot of investors own the same names. When everyone is in the same trade, the exit gets crowded.</li><li><strong>Memory prices are biting.</strong> Memory makers raised prices so fast that phone and PC makers are pushing back, and reports say Apple is lining up Chinese suppliers. High prices can shrink demand outside AI.</li><li><strong>Korea.</strong> A Korean brokerage cut its estimate for SK Hynix's quarter because of slower HBM4 shipments, and the stock had its worst day ever on July 13. Every memory stock followed it down.</li><li><strong>A lawsuit.</strong> A new class action accuses the three DRAM makers of limiting supply to raise prices.</li><li><strong>Oil and rates.</strong> Since fighting with Iran resumed on July 7, oil is up more than 25%. The 10-year Treasury yield is rising, and traders see a real chance of a Fed rate hike within the next two meetings.</li></ol>
<p>The fifth matters most for valuations. Higher rates make future profits worth less today, and that hits expensive growth stocks first. The second matters for the cycle, and I'm watching it. The third and fourth look like noise to me, since one analyst's estimate and a lawsuit don't change HBM demand.</p>
<p>The real test comes next week, when Microsoft, Alphabet, Amazon and Meta report and update their spending plans. If AI spending holds, this is a correction inside an uptrend. If it gets cut, my whole account has a problem, and I'll say so here.</p>`
},
{
  id:"p-2026-07-27-skhy", date:"2026-07-27", cat:"stock", tickers:["SKHY"],
  title:"Why I bought SKHY",
  dek:"The leader in AI memory, now listed in New York.",
  spec:[{t:"SKHY", name:"SK Hynix", layer:"Memory & storage", does:"The largest maker of high-bandwidth memory", move:"Bought Jul 27", watch:"HBM4 shipments for Nvidia's next chips"}],
  body:`<p>SK Hynix is the leader in high-bandwidth memory, the stacked DRAM that sits next to every Nvidia AI chip. Until this month, owning it meant buying shares in Korea. On July 10 it listed American depositary shares on the Nasdaq, so now I can own it directly.</p>
<p>Why add a third memory company when I already hold Micron and Sandisk? Because SK Hynix has the biggest share of the most important product. It supplied most of the HBM for Nvidia's current chips and is expected to supply the majority for the next generation, Vera Rubin. Micron and Samsung compete for second place.</p>
<p>The timing is uncomfortable. Memory stocks are in a sharp selloff, and the US shares are down about 15% since their first day. SK Hynix reports tomorrow, after a Korean broker warned it could miss on slower HBM4 shipments. I'm buying anyway, because I care more about HBM demand in 2027 than about one quarter's shipment timing.</p>
<p>The risks: this is a cyclical company near the top of a boom, Samsung is fighting hard to win back HBM share, and Korean stocks carry their own political and currency risk.</p>
<p>With this buy I've spent the last of my cash. That's not where I wanted to be, and it's the main thing I'm watching this week.</p>`
},
{
  id:"p-2026-07-31-worst-month", date:"2026-07-31", cat:"markets", tickers:["SKHY","VRT","MU","SNDK","AXTI","BE"],
  title:"Chips' worst month since 2008",
  dek:"The chip index fell 21% in July. I ran out of cash two days before the bottom.",
  body:`<p>The Philadelphia semiconductor index fell about 21% in July, its worst month since October 2008. My account fell about 23%. I spent the last of my cash on July 27, two trading days before the bottom, and the account dropped about 17% in those two days.</p>
<h3>How it ended</h3>
<p>July 28 and 29 stacked the bad news. SK Hynix posted a record quarter that still missed estimates. A report said a Chinese state-backed company had started mass-producing advanced lithography tools, which hit the whole chip-equipment chain. Vertiv fell 17% when revenue came in light on project timing. And the Fed held rates, with three officials voting for a hike.</p>
<p>Then July 30 flipped it. Microsoft said its cloud business grew 43%, the fastest since 2022, and chip stocks jumped. Micron rose about 18% and Sandisk about 26% in a day. Bloom Energy reported its first billion-dollar quarter and also rose 26%. AXT reported a blowout quarter after the close and rose another 29% the next day.</p>
<h3>What I got wrong</h3>
<p>Most of my July buys were in companies I still want to own. The mistake was the pace. On July 7 I said I'd buy in steps, and by July 16 I was down to 4% cash. When the real flush came, I had nothing left to buy it with.</p>
<h3>A new rule</h3>
<p><strong>Cash never goes below 10% of the account, even when prices are on my list.</strong> The last 10% is for the day I can't predict.</p>`
},
{
  id:"p-2026-08-07-earnings-check", date:"2026-08-07", cat:"portfolio", tickers:["AXTI","BE","ALAB","SNDK","AAOI","VRT"],
  title:"Earnings check",
  dek:"Six reports in nine days, graded against the reasons I bought.",
  body:`<p>Most of my companies reported over the past nine days. Here are the six that matter most for the account, each graded against the thesis I wrote.</p>
<ul>
<li><strong>AXT:</strong> revenue up about 165% from a year ago, record indium phosphide sales, and a real profit. The stock has nearly doubled since the report. <em>Thesis confirmed.</em></li>
<li><strong>Bloom Energy:</strong> its first billion-dollar quarter, revenue up about 165%, and a higher forecast for the year. The CEO said some customers are cancelling gas-turbine orders to buy fuel cells instead. <em>Thesis confirmed.</em></li>
<li><strong>Astera Labs:</strong> revenue doubled, and it guided to 40% growth next quarter alone. The stock fell 12% the next day anyway. <em>Thesis confirmed, valuation stretched.</em></li>
<li><strong>Sandisk:</strong> full-year revenue up 175%, with data center sales more than five times last year's. About two-thirds of the quarter's growth came from higher prices. <em>Thesis confirmed, with a reminder that price-driven growth can reverse.</em></li>
<li><strong>AAOI:</strong> record revenue and a return to profit. Shipments of its 800G modules more than doubled in a quarter, and it expects demand to outrun capacity into mid-2027. <em>On track.</em></li>
<li><strong>Vertiv:</strong> the one miss. Revenue grew 24% but fell short of estimates because of supply-chain congestion and project timing. It raised its full-year outlook anyway. <em>Intact, but the market has stopped giving it the benefit of the doubt.</em></li>
</ul>
<p>The pattern is that the businesses are doing better than the stocks. My account is up about 18% this week, but it's still well below where July started. July punished prices, not results.</p>`
},
{
  id:"p-2026-08-12-uamy", date:"2026-08-12", cat:"stock", tickers:["UAMY"],
  title:"UAMY: half the price, half the forecast",
  dek:"Antimony prices halved. Part of my thesis broke, and part of it didn't.",
  spec:[{t:"UAMY", name:"United States Antimony", layer:"Defense, space & minerals", does:"The only integrated US antimony producer", move:"Holding, no adds", watch:"China's export ban suspension, which ends Nov 27"}],
  body:`<p>United States Antimony cut its 2026 revenue forecast roughly in half yesterday, and the stock fell about 25%. The reason is simple. Antimony prices have about halved from a year ago, and management expects them to stay low for the rest of 2026.</p>
<p>My thesis had two parts. The first was scarcity: China's export ban would keep antimony expensive. That part broke. China suspended the ban last November, users who stockpiled during the 2025 panic are working through their inventory, and prices came back down. The second part was strategic: the only integrated US producer, with defense contracts and federal grants behind it. That part is intact, but it's worth much less when the metal is cheap.</p>
<p>My rule says a broken thesis gets sold. Half-broken is harder. The position is now about 1% of the account, so it can't hurt me much either way, and there's one dated catalyst left: China's suspension of the ban ends on November 27. If Beijing lets it lapse, scarcity comes back.</p>
<p>So I'm holding, with no adds and a deadline. If the suspension is extended and prices haven't found a floor by year-end, I'll sell and use the loss against this year's gains. Either way, the lesson stands: I bought a commodity story when the commodity price was the whole story.</p>`
},
{
  id:"p-2026-08-14-inflation", date:"2026-08-14", cat:"markets", tickers:[],
  title:"Inflation is stuck, and the Fed is restless",
  dek:"July's numbers, a stalling job market, and why a rate hike is now on the table.",
  body:`<p>Two reports this month frame the problem the Fed is facing.</p>
<p><strong>Inflation is stuck near 3.4%.</strong> Consumer prices in July rose 3.4% from a year earlier, a bit below June and well below April's 4.2% peak. Underneath, it's a split picture. Core inflation, which leaves out food and energy, fell to 2.4%, the lowest since early 2021. Gasoline is up about 27% from a year ago. Most of the inflation problem is the war, coming through oil.</p>
<p><strong>Hiring has stalled.</strong> The economy lost about 23,000 jobs in July, and earlier months were revised down. Unemployment is still low at 4.1%, but the trend is weak.</p>
<p>A weak job market usually means rate cuts. This time, three Fed officials already voted to raise rates in July, and the committee is treating inflation as the bigger risk. Markets now price a real chance of a hike in September, which would be the first since 2023.</p>
<p>Why this matters for my account: almost everything I own is valued on profits years in the future, and higher rates make those profits worth less today. That doesn't change how much memory Micron sells. It changes what investors will pay for it, and the July selloff was partly that.</p>
<p>I've added new money recently, so cash is back to about a quarter of the account. It earns interest in a money market fund while I wait.</p>`
},
{
  id:"p-2026-08-19-crwv", date:"2026-08-19", cat:"stock", tickers:["CRWV"],
  title:"CRWV: the backlog is winning",
  dek:"Checking CoreWeave against the one scorecard I gave it in April.",
  spec:[{t:"CRWV", name:"CoreWeave", layer:"Compute & sites", does:"Rents out AI computing on multi-year contracts", move:"Holding, no adds", watch:"Backlog growth vs. debt growth"}],
  body:`<p>In April I gave CoreWeave one scorecard: are new contracts growing faster than new debt? Last week's report is the clearest answer yet.</p>
<p><strong>Contracts.</strong> The backlog of signed revenue reached about $104 billion, up about 246% from a year ago, and the company added more than $25 billion of new commitments in the weeks after the quarter closed. Revenue more than doubled.</p>
<p><strong>Debt.</strong> About $35 billion, and interest costs more than doubled from a year ago. The company still loses money after interest, and interest is growing faster than revenue right now. That's the number the bears point to.</p>
<p>My read is that the backlog is winning. Contracted revenue is growing faster than the debt that funds it, and most of that debt is tied to specific contracts. The danger isn't this year's interest bill. It's a big customer failing to pay, and the customer list is still short.</p>
<p>The stock jumped about 19% the day after the report and has since given most of it back. My position is up about 15% from cost and is about 4% of the account. I'm not adding, because the debt still sets my sizing.</p>`
},
{
  id:"p-2026-08-21-memory-cycle", date:"2026-08-21", cat:"research", tickers:["MU","SNDK","SKHY"],
  title:"How long can the memory boom last?",
  dek:"Prices are still rising, but more slowly. What would tell me the cycle is turning.",
  body:`<p>Memory makers are posting numbers nobody has seen before. SK Hynix's operating profit last quarter was more than six times what it was a year earlier. Sandisk's yearly revenue nearly tripled. Micron reports next month. My three memory positions are about 12% of the account, so the question is how long this lasts.</p>
<p><strong>The case that it keeps going.</strong> AI demand for high-bandwidth memory is booked far ahead, HBM eats about three times the factory space of normal memory, and new factories take two to three years. DRAM contract prices are still rising, by about 13% to 18% this quarter according to TrendForce.</p>
<p><strong>The case that it's peaking.</strong> That same forecast was around 60% last quarter, so growth is slowing fast. Phone and PC makers say they've hit their price limit. Korean makers are spending heavily on new capacity. And China is building its own supply, with domestic chipmaking tools now in production.</p>
<p>Memory cycles don't end when prices stop rising. They end when supply catches up while everyone is still confident. Here's what I'll watch:</p>
<ol><li>Contract prices flat for two straight months.</li><li>All three DRAM makers raising spending plans at the same time.</li><li>Customer inventories building up instead of running down.</li><li>Chinese DRAM showing up in big-name phones and PCs.</li></ol>
<p>None of these is flashing yet, though the first is getting close. I trimmed hard in June, so my memory weight is about half what it was then. I'll hold it there and let these signals decide the next move.</p>`
},
{
  id:"p-2026-08-28-nvda-mrvl", date:"2026-08-28", cat:"markets", tickers:["NVDA","MRVL"],
  title:"Nvidia up, Marvell down",
  dek:"Two reports in two days, and a lesson about when good news counts.",
  body:`<p>Nvidia reported on Wednesday. Revenue rose 106% from a year ago, data center sales rose 117%, and it guided higher again for next quarter. Management also said growth next year should be around 70%, limited by supply rather than demand. For the companies I own, that's the most important sentence of the month, because every Nvidia system needs memory, optics, connectivity chips and power.</p>
<p>Marvell reported the next day. Revenue grew 37%, data center sales grew 46%, and it raised its outlook. The stock fell 10% today.</p>
<p>The reason is timing. Earlier this month Marvell disclosed an expanded custom-chip deal with Google that could be worth up to $120 billion in revenue over many years, and the stock jumped. On this week's call, management said real revenue from the deal starts in fiscal 2029, more than two years out. Investors had priced it as if it started sooner.</p>
<p>The lesson: a good report isn't enough when the stock has already moved on the story. I bought Marvell for exactly this custom-chip business, and nothing in the report weakens it. My position is about 12% below cost. I'm holding without adding until the custom-chip ramp shows up in the numbers.</p>
<p>Also today, Fed Chair Kevin Warsh gave his first Jackson Hole speech, and markets read it as hawkish. Traders now lean toward a rate hike in September.</p>`
},
{
  id:"p-2026-09-01-august-review", date:"2026-09-01", cat:"portfolio", tickers:[],
  title:"August review",
  dek:"A better month, new cash on the sidelines, and why I'm not spending it yet.",
  body:`<p>August was a recovery month. The account rose about 7%, ahead of the S&amp;P 500 and the semiconductor ETF, which each rose about 3%. It's still about 18% below where it was on June 30.</p>
<h3>Movers</h3>
<p>Sandisk (+29%) and Micron (+16%) led as memory bounced. AAOI rose about 14% after its report. AXT ran up nearly 60% in two weeks and then gave all of it back, ending the month flat. The laggards were One Stop and TeraWulf, each down about 15%. My June speculative buys, One Stop, Planet Labs and POET, are now each about 40% below cost.</p>
<h3>New cash</h3>
<p>I added new money to the account after the July buying, so cash is about 28% of the account. I'm in no hurry to spend it. July showed me what happens when I deploy too fast, and the backdrop has gotten harder: the Fed sounds ready to raise rates, oil is back near $90, and the 10-year Treasury yield is close to 4.8%.</p>
<h3>The plan for September</h3>
<ul><li>No new positions until after the Fed meeting on September 16.</li><li>Add to core names only on big drops, in small steps.</li><li>The speculative tier stays frozen: no adds to One Stop, Planet Labs, POET or UAMY.</li></ul>`
},
{
  id:"p-2026-09-04-pl", date:"2026-09-04", cat:"stock", tickers:["PL"],
  title:"PL: beat, raise, and still falling",
  dek:"A good quarter from Planet Labs, and my worst June buy.",
  spec:[{t:"PL", name:"Planet Labs", layer:"Defense, space & minerals", does:"Satellites that image Earth's land every day", move:"Holding, no adds", watch:"Backlog growth and new defense contracts"}],
  body:`<p>Planet Labs reported last night: sales up 58% from a year ago, its first positive adjusted profit, and a higher forecast for the year. The stock slipped again today.</p>
<p>Two things explain it. The forecast for next quarter came in below what analysts expected, and the backlog of signed contracts grew only 11% from a year ago, which is slow for a company priced on growth. The company also has a program in place to sell up to $1.5 billion of new stock over time, and that supply hangs over the price.</p>
<p>The stock is down about 65% from its May high and about 44% below my cost. It's the worst result among my June buys.</p>
<p>What went wrong is mostly mine. I bought after a sharp drop from the May peak and assumed the worst was over. Even after that drop, the stock was still up more than 50% for the year when I bought, so the valuation had a long way to fall. The business is doing roughly what I expected. The price I paid wasn't justified.</p>
<p>I'm holding, with no adds. Defense demand is real and AI is making imagery more useful, and at about 3% of the account the position can't sink me. If the backlog doesn't speed up by early next year, I'll sell and take the tax loss.</p>`
},
{
  id:"p-2026-09-10-oil", date:"2026-09-10", cat:"markets", tickers:["BE"],
  title:"Oil is back above $100",
  dek:"Attacks on tankers and a Saudi pipeline sent crude higher. How it reaches my portfolio.",
  body:`<p>Brent crude crossed $100 a barrel yesterday for the first time since late July. Tankers were attacked near Dubai and Iraq, a drone strike shut Saudi Arabia's main east-west oil pipeline, and Ukraine kept hitting Russian oil infrastructure. Traffic through the Strait of Hormuz is still a fraction of its prewar level, and the US emergency oil reserve is at its lowest since the early 1980s.</p>
<p>I don't own energy stocks, but oil reaches my portfolio three ways.</p>
<ol><li><strong>Inflation.</strong> Gasoline and diesel feed straight into consumer prices, and fuel costs spread into shipping and food.</li><li><strong>Rates.</strong> Inflation keeps the Fed leaning toward a hike next week. The 10-year Treasury yield is near 4.9%, up from about 4.5% in early July.</li><li><strong>Power.</strong> Expensive energy makes reliable local electricity more valuable, which supports the case for Bloom Energy and the power-site companies. It also raises costs for every data center.</li></ol>
<p>The first two are bad for expensive growth stocks, which is most of what I own, and the third is mixed. On balance an oil shock is a headwind for this account, and it's one reason I'm keeping a big cash cushion.</p>
<p>The next inflation report and next week's Fed meeting are the two events that matter most this month.</p>`
},
{
  id:"p-2026-09-17-fed-hike", date:"2026-09-17", cat:"markets", tickers:[],
  title:"The Fed hikes into 5% yields",
  dek:"The first rate increase since 2023, and what a 5% Treasury yield means for stocks like mine.",
  body:`<p>The Fed raised its benchmark rate by a quarter point yesterday, to a range of 3.75% to 4%. It's the first increase since July 2023 and the first under Chair Kevin Warsh. The vote was unanimous, and most officials expect one more hike before the end of the year.</p>
<p>Warsh's message was short: inflation has been too high for too long, and this summer's readings don't show real improvement. August inflation held at 3.4%. Energy is the main reason, but monthly core inflation also came in a little hot.</p>
<p>The bond market moved first. On Monday the 10-year Treasury yield crossed 5%, a level it had touched only briefly in 2023 and hadn't otherwise reached since 2007. Inflation worries, heavy government borrowing and the oil shock all pushed it there.</p>
<h3>Why 5% matters for my stocks</h3>
<p>A 5% yield is what investors can earn with almost no risk, and every stock has to compete with it. For a company valued on profits five or ten years out, a higher discount rate takes a bigger bite out of today's price. That arithmetic is why my account fell harder than the market on every rate scare this summer.</p>
<p>The flip side is that my cash earns more, and the bar for new buys is higher. A stock has to offer much more than 5% a year to be worth the risk. I'm fine with that bar. It keeps me from buying things just because they've fallen.</p>`
},
{
  id:"p-2026-09-23-is-this-2000", date:"2026-09-23", cat:"research", tickers:["ORCL","CRWV","AAOI","AXTI"],
  title:"Is this 2000?",
  dek:"Comparing today's AI spending boom with the telecom bust, point by point.",
  body:`<p>Every week someone compares the AI boom to the telecom bubble of 2000. I own the suppliers, and suppliers got destroyed last time, so I owe myself a straight comparison.</p>
<h3>What looks the same</h3>
<ul><li><strong>Spending is outrunning revenue.</strong> Microsoft, Alphabet, Amazon and Meta plan to spend more than $700 billion on capital projects this year, up from about $410 billion in 2025. AI revenue is growing fast, but not that fast yet.</li><li><strong>Some builders run on debt.</strong> Oracle borrowed heavily to build data centers for OpenAI, its free cash flow is deeply negative, and its stock had its worst week in 25 years in June. CoreWeave, IREN and TeraWulf all borrow heavily too.</li><li><strong>Money goes in circles.</strong> Chipmakers invest in AI labs that then buy their chips, which flatters demand.</li><li><strong>The key buyer is private.</strong> OpenAI has pushed its IPO to 2027, so the market can't see its books.</li></ul>
<h3>What looks different</h3>
<ul><li><strong>The biggest spenders are rich.</strong> The four giants fund most of their spending from cash flow. In 2000, the fiber was laid by young, indebted carriers that went bankrupt.</li><li><strong>The capacity is being used.</strong> By 2002 only a few percent of the fiber in the ground was lit. Today Nvidia says next year's growth is limited by supply.</li><li><strong>Valuations are high but not extreme.</strong> Leaders like Nvidia trade at a fraction of the multiples Cisco reached in 2000.</li></ul>
<h3>What I take from it</h3>
<p>The part that worries me: in 2001, optical component makers fell harder than almost anything. Optics is about a quarter of my account. If spending stalls, my stocks fall first and furthest.</p>
<p>So I'm setting one clear sell signal. If two of the four big spenders cut their capital spending plans, I cut the account's AI hardware exposure by a third, with no debate. Until then, the evidence says the demand is real.</p>`
},
{
  id:"p-2026-09-25-iren-wulf", date:"2026-09-25", cat:"stock", tickers:["IREN","WULF"],
  title:"IREN and TeraWulf: same plan, different results",
  dek:"Two former bitcoin miners, one lesson about when revenue starts.",
  spec:[{t:"IREN", name:"IREN", layer:"Compute & sites", does:"AI cloud on its own power sites", move:"Holding", watch:"Each new deployment going live"},{t:"WULF", name:"TeraWulf", layer:"Compute & sites", does:"Builds and leases power-ready data centers", move:"Holding, no adds", watch:"Kentucky build progress and financing"}],
  body:`<p>I own two former bitcoin miners turning their power sites into AI data centers. Since July they've gone in opposite directions. IREN is roughly back to my cost, while TeraWulf is about 25% below where I bought it.</p>
<p><strong>IREN</strong> is further along. Microsoft accepted the first of four deployments under its five-year cloud contract, so revenue from that deal has started. In August IREN signed a second multi-year contract with a frontier AI lab, and this month its 2-gigawatt Texas site cleared an important step in the state's grid-connection process. Contracted annual revenue is now about $4 billion.</p>
<p><strong>TeraWulf</strong> has the bigger single contract, the 20-year Anthropic lease, but money from it doesn't start until late 2027. Until then it has to raise and spend billions to build the campus, which means more borrowing and more shares. Insiders have also been selling. The market is charging for the wait.</p>
<p>I should have weighed this in July: for capital-heavy companies, <em>when</em> the revenue starts matters as much as how big the contract is. IREN's revenue is arriving now. TeraWulf's is a year away, with a lot of financing in between.</p>
<p>I'm holding both. TeraWulf is about 3% of the account, and the lease is real. But I won't add until the Kentucky build shows steady progress and most of the funding is in place.</p>`
},
{
  id:"p-2026-10-01-mu", date:"2026-10-01", cat:"stock", tickers:["MU"],
  title:"Micron's $54 billion quarter",
  dek:"Record numbers, a year of visibility, and a hard look at my own trims.",
  spec:[{t:"MU", name:"Micron Technology", layer:"Memory & storage", does:"One of three DRAM makers; also makes flash", move:"Holding (trimmed Jan and Jun)", watch:"2027 HBM pricing and new capacity plans"}],
  body:`<p>Micron reported last night, and the numbers barely look real. Quarterly revenue was nearly five times what it was a year ago. Gross margin was about 87%, which is software territory for a company that runs factories. Next quarter's forecast is higher again.</p>
<p>Two details matter more than the headline. First, Micron says most of its high-bandwidth memory supply for 2027 is already under contract at significantly higher prices. That's a year of visibility in an industry that usually has none. Second, its data center storage business, on the flash side, has become a major business of its own. AI is pulling on both halves of the company.</p>
<p>Now the uncomfortable part. I trimmed Micron in January and twice in June under my size rule, and the stock is well above every price I sold at. My remaining shares are up about 360% from cost, but the position is much smaller than it would have been.</p>
<p>Was trimming wrong? The rule did its job. It moved money out of a position that had grown too big, before July cut memory stocks by a third or more. But I trimmed a cyclical company before the cycle showed any sign of turning. My consensus rule should have told me to wait, and the size rule overrode it. Next time a position outgrows its target while its cycle is still tightening, I'll trim less.</p>
<p>On current earnings, Micron is still the cheapest way I know to own AI memory. It stays, at about 6% of the account.</p>`
},
{
  id:"p-2026-10-02-q3-review", date:"2026-10-02", cat:"portfolio", tickers:[],
  title:"Third-quarter review",
  dek:"Down 13% in a quarter the market rose. Still up about 88% for the year.",
  body:`<p>The third quarter was the hardest stretch since I started this journal. The account fell about 13% on a time-weighted basis, while the S&amp;P 500 rose 2% and the semiconductor ETF fell 7%. For the year it's still up about 88%, against 12% for the S&amp;P 500 and 69% for the semiconductor ETF.</p>
<h3>The shape of it</h3>
<p>July: −23%. August: +7%. September: +6%. From the early-June high to the July 29 low, the account fell about 40%. Since that low it has recovered about 38%.</p>
<h3>What worked</h3>
<p>All figures below are as of September 30.</p>
<ul><li><strong>Most of the July buys.</strong> AXT was up about 60% from my average cost, SK Hynix about 28%, and Marvell's July lot about 17%. As a group the July purchases were up about 13%, despite the timing.</li><li><strong>Selling AAOI in June.</strong> The stock ended the quarter about 46% below my average June sale price, and I bought part of it back far lower.</li></ul>
<h3>What didn't</h3>
<ul><li><strong>The June speculative buys.</strong> Planet Labs, One Stop and POET were down between 35% and 50% from cost.</li><li><strong>TeraWulf.</strong> Down about 30% from my July price.</li><li><strong>Pace.</strong> I spent all my cash in three weeks and had none left for the bottom.</li></ul>
<h3>Lessons</h3>
<ol><li>Small, unprofitable companies fall hardest in a rate scare. My speculative tier should stay smaller than it was in June.</li><li>Buying into a falling market needs a schedule as well as a price list.</li><li>A good business can still be a bad buy at the wrong price.</li></ol>
<p>Going into the fourth quarter, cash is about 26% of the account across sixteen positions. The biggest group is optics, at about a quarter of the account.</p>`
},
{
  id:"p-2026-10-09-where-things-stand", date:"2026-10-09", cat:"portfolio", tickers:["AAOI","AXTI","ALAB"],
  title:"Where things stand",
  dek:"A rough week for AI stocks, a record for the market, and a snapshot of the account.",
  body:`<p>The S&amp;P 500 set a record on Tuesday. My account fell about 6% this week anyway, because the week's big story hit exactly what I own.</p>
<h3>The OpenAI number</h3>
<p>On Thursday the Financial Times reported that OpenAI's annualized revenue was about $50 billion at the end of September, roughly $20 billion less than a figure that had circulated widely. Most of the gap is accounting, since OpenAI doesn't count sales made through cloud partners the way Anthropic does. But OpenAI is the biggest single buyer behind a lot of AI infrastructure, and the market sold first. Chip stocks fell about 4% on the week, and AAOI, AXT and Astera Labs each lost 9% to 14% in a day.</p>
<p>I didn't sell. The gap is about how revenue is counted, OpenAI is still growing very fast, and the same day Samsung guided to a record quarterly profit on memory demand. My sell signal hasn't changed since September: cuts to big-tech spending plans. None have come.</p>
<h3>The rest of the world</h3>
<p>September added only 29,000 jobs and unemployment rose to 4.2%, which lowered the odds of another Fed hike. The 10-year yield is still above 5.2%. Oil is near $90, and the war with Iran has no ceasefire in sight.</p>
<h3>The account today</h3>
<p>The account is worth about 36% more than the total money I've put in. On a time-weighted basis, which strips out when the cash went in, it's up about 84% this year against 14% for the S&amp;P 500.</p>
<ul><li>Optics: 24%</li><li>Chips and networking: 15%</li><li>Memory and storage: 13%</li><li>Compute and sites: 9%</li><li>Power and cooling: 7%</li><li>Defense, space and minerals: 5%</li><li>Cash: 27%</li></ul>
<h3>What's next</h3>
<p>Third-quarter earnings start next week, and the big-tech spending updates come at the end of the month. The midterm elections are on November 3. I'll put cash to work only in steps, and never below the 10% floor.</p>`
},
{
  id:"p-2026-10-14-crwv-add", date:"2026-10-14", cat:"stock", tickers:["CRWV"],
  title:"Adding to CRWV in a bond scare",
  dek:"The bond market is pricing in serious default risk. I think it's too gloomy, and I bought.",
  spec:[{t:"CRWV", name:"CoreWeave", layer:"Compute & sites", does:"Rents out AI computing on multi-year contracts", move:"Added Oct 14", watch:"Its bond yields and the terms of its next debt deal"}],
  body:`<p>CoreWeave fell 15.5% today and is down about 20% since Friday. The selling started in its bonds. Yields on its 2032 bonds hit a record near 15% this week, and the price of insuring its debt against default now implies something like a 60% chance of default within five years.</p>
<p>In August I wrote that the debt sets my sizing and that I wasn't adding. Today I added anyway, at about 39% below the August high. Here's why I changed my mind.</p>
<p>The business hasn't changed since August. The backlog of signed contracts is still above $100 billion, most of the debt is tied to specific contracts with large customers, and Nvidia has agreed to buy any unused capacity through 2032. Nothing in the quarter so far says customers are walking away. What changed is the price of the debt, and fear about AI borrowing in general. I think a 60% default probability is too pessimistic for a company with that backlog.</p>
<p>The risk is real, though. If CoreWeave has to refinance at 15%, the interest bill eats much of the profit from its contracts, and the stock could fall a lot further. I'm betting the bond market is wrong, and bond markets are often right about debt.</p>
<p>The position is now about 8% of the account. That's the cap. If its bonds keep falling or its next debt deal comes at these yields, I'll treat that as the thesis breaking.</p>
<p>Also today, September inflation came in at 3.7%, above forecasts, with gasoline up 9% in a single month. That makes another Fed hike more likely.</p>`
},
{
  id:"p-2026-10-22-worst-day", date:"2026-10-22", cat:"portfolio", tickers:["LITE","WULF"],
  title:"Buying on the worst chip day since June",
  dek:"A new position in Lumentum, and an add to TeraWulf that breaks one of my own conditions.",
  body:`<p>Chip stocks fell 6.7% today, their worst day since June. Lam Research, which makes chipmaking equipment, said supply-chain limits trimmed its forecast and could hold back chip output through 2027. My account is down about 19% since my October 9 update. I made two buys.</p>
<h3>Lumentum, a new position</h3>
<p>Lumentum makes the lasers inside high-speed optical modules. Today's drop left it about a third below the record it set on October 6. Lam's warning is mostly about too much demand chasing too little capacity, which is the setup my optics thesis is built on. Full post tomorrow.</p>
<h3>TeraWulf, an add</h3>
<p>I bought more TeraWulf at about 47% below my July price, which cuts my average cost by about a third. This breaks what I wrote in September: no adds until the Kentucky build shows steady progress and most of the funding is in place. The power approval for the site is done, but the roughly $3.5 billion of debt for the build is still being arranged.</p>
<p>My reasoning is that the price now treats the Anthropic lease as if it might never pay. I don't think that's right. But I'm writing down the condition I skipped so I'm graded on it. If the Kentucky debt closes on reasonable terms, this was a good buy. If TeraWulf has to sell lots of new shares at these prices, it wasn't.</p>
<h3>Where that leaves the account</h3>
<p>Optics is now about 27% of the account and compute and sites about 19%. TeraWulf alone is about 9%, which is more than I'd like for a company that hasn't finished funding its build. Cash is about 15%, still above my 10% floor.</p>`
},
{
  id:"p-2026-10-23-lite", date:"2026-10-23", cat:"stock", tickers:["LITE","AXTI","AAOI"],
  title:"Why I bought LITE",
  dek:"The laser maker at the center of the optics bottleneck, bought a third off its high.",
  spec:[{t:"LITE", name:"Lumentum", layer:"Optics", does:"Lasers and optical parts for AI data centers", move:"Bought Oct 22", watch:"Co-packaged optics orders and its November report"}],
  body:`<p>Lumentum makes the lasers that turn data into light inside high-speed optical modules. It's one of very few companies that can make these lasers at volume, and demand has been running ahead of supply all year.</p>
<p>Two newer products are what make it more than a parts supplier. The first is lasers for co-packaged optics, where the optical connection is built straight into the chip package instead of a separate plug-in module. The second is optical circuit switches, which route light between servers without converting it back to electricity. Management says order visibility now reaches four to five years out, and that its largest customer has stepped up co-packaged optics work for 2027 to 2029. Nvidia also owns a stake in the company.</p>
<p>It also fits the map of what I already own. AXT makes the indium phosphide wafers the lasers are built on, and in July Lumentum reserved AXT's capacity through 2031. AAOI builds finished modules. With Lumentum, I now own the wafer, the laser and the module.</p>
<p>That's also the main risk to the account: optics is now more than a quarter of it, and when optics crashed in 2001 it crashed harder than almost anything. For Lumentum itself, the risks are valuation and execution. Even after this drop, the stock is up nearly five times from a year ago, so any stumble in ramping new capacity will be punished.</p>
<p>It's about 6% of the account. Its next report, due in November, is the first test.</p>`
},
{
  id:"p-2026-10-30-big-tech", date:"2026-10-30", cat:"markets", tickers:["GOOGL","MSFT","META","AMZN","MRVL","LITE"],
  title:"Big tech's spending holds, but cash is running thin",
  dek:"My sell signal didn't fire. A different warning light came on.",
  body:`<p>In September I set one clear sell signal: if two of the four biggest spenders cut their 2026 spending plans, I cut my AI hardware exposure by a third. This was the week they reported, so here's the check.</p>
<ul><li><strong>Alphabet</strong> kept its 2026 plan of $195 to $205 billion and said 2027 spending will rise significantly.</li><li><strong>Meta</strong> still expects up to $145 billion this year.</li><li><strong>Amazon</strong> still expects about $220 billion.</li><li><strong>Microsoft</strong> spent less in the quarter than analysts expected, which it blamed on the timing of deliveries rather than a cut.</li></ul>
<p>No one cut, so the signal didn't fire.</p>
<h3>The new problem is cash</h3>
<p>The spending is now bigger than the cash these companies bring in. Alphabet's free cash flow turned negative last quarter, about −$9 billion, and the stock had its worst day ever yesterday, down about 13%. Amazon's free cash flow has been negative over the past year. Meta plans to raise $95 billion by selling stock, and Microsoft is turning to the bond market. Today the chip index fell 7.2% after a weak outlook from Intel and a disappointing quarter from Amazon.</p>
<p>The richest companies in the world are now borrowing and selling shares to fund AI. That isn't a cut, but it makes the boom depend on markets staying willing to lend. So I'm adding a second signal: if any of the four lowers its 2027 plans, or a major AI debt deal fails, I start cutting.</p>
<h3>Marvell and Lumentum</h3>
<p>On Wednesday, Bloomberg reported that Marvell is in advanced talks to buy Lumentum in an all-stock deal, possibly announced as soon as next week. I own both. Marvell fell and Lumentum rose, since Marvell would pay with a lot of new shares. If it happens, my Lumentum shares turn into Marvell shares, and my two biggest groups, optics and chips, which are already about 40% of the account, would sit in fewer companies.</p>
<p>Also this week, the Fed held rates at 3.75% to 4%. Its next decision is December 9.</p>`
},
{
  id:"p-2026-10-31-october-review", date:"2026-10-31", cat:"portfolio", tickers:["CRWV","WULF","LITE"],
  title:"October review",
  dek:"My second-worst month of the year, and three buys that made me more exposed to debt.",
  body:`<p>October was rough. The account fell about 20% for the month on a time-weighted basis, while the S&amp;P 500 fell 1% and the semiconductor ETF fell 14%. For 2026 it's still up about 51%, against 11% for the S&amp;P 500 and 45% for the semiconductor ETF. On the total money I've put in, the account is up about 12%.</p>
<h3>What hit it</h3>
<ul><li>A hot inflation report (3.7%) that kept another Fed hike on the table.</li><li>The CoreWeave bond scare, which spread to every company building AI data centers with borrowed money.</li><li>Two big chip selloffs: Lam's supply warning on October 22, and Intel and Amazon on October 30.</li><li>Oil: Brent rose about 14% in the month as tanker attacks in the Strait of Hormuz picked up.</li></ul>
<p>None of my holdings rose in October. The biggest drops were IREN and One Stop (−41% each), CoreWeave (−37%), Sandisk (−34%), and AAOI and POET (−30% each). Vertiv held up best, down 4%.</p>
<h3>My three buys</h3>
<p>So far: Lumentum is up about 12% from my price, the TeraWulf add is up about 4%, and the CoreWeave add is down about 17%.</p>
<h3>What I got wrong</h3>
<p>For the second time this year, I bought into a falling market before it finished falling. The bigger mistake was what I bought. Compute and sites, my most debt-dependent group, went from about 9% of the account to about 19% in two weeks, right as debt became the market's main worry. The 10% cash floor held, so I still have about 15% in cash.</p>
<h3>New limits</h3>
<ul><li>Compute and sites stays capped at about a fifth of the account.</li><li>No more adds to CoreWeave or TeraWulf until their next debt deals close on reasonable terms.</li></ul>
<h3>The account today</h3>
<ul><li>Optics: 28%</li><li>Compute and sites: 19%</li><li>Chips and networking: 13%</li><li>Memory and storage: 13%</li><li>Power and cooling: 7%</li><li>Defense, space and minerals: 5%</li><li>Cash: 15%</li></ul>
<h3>Coming up</h3>
<p>The midterm elections are on Tuesday, and a Marvell and Lumentum deal could be announced the same week. Then come the jobs report, Lumentum's earnings, Nvidia's report in late November, the November 27 end of China's antimony export-ban pause, and the Fed on December 9.</p>`
}
];
</script>
<script>
(function(){
  "use strict";
  var POSTS = POSTS_A.concat(POSTS_B).sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  var BY_ID = {};
  var CAT = {stock:"Stock", markets:"Markets", research:"Research", portfolio:"Portfolio"};
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MINUS = "−";
  var state = {cat:"all", q:"", ticker:null, listScroll:0, sort:"w"};

  var scratch = document.createElement("div");
  POSTS.forEach(function(p, i){
    BY_ID[p.id] = p;
    p.idx = i;
    scratch.innerHTML = p.body;
    var tk = (p.tickers || []).slice();
    (p.spec || []).forEach(function(s){ if(tk.indexOf(s.t) === -1) tk.unshift(s.t); });
    p.allTickers = tk;
    p.hay = (p.title + " " + p.dek + " " + tk.join(" ") + " " + scratch.textContent).toLowerCase();
  });

  /* ---------- helpers ---------- */
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function parts(iso){ var p = iso.split("-"); return {y:+p[0], m:+p[1]-1, d:+p[2]}; }
  function fmtLong(iso){ var p = parts(iso); return MONTHS[p.m] + " " + p.d + ", " + p.y; }
  function fmtShort(iso){ var p = parts(iso); return MON[p.m] + " " + (p.d < 10 ? "0" : "") + p.d; }
  function fmtMid(iso){ var p = parts(iso); return MON[p.m] + " " + p.d + ", " + p.y; }
  function signed(v, d){
    var n = Math.abs(v).toFixed(d == null ? 1 : d);
    return (v > 0 ? "+" : (v < 0 ? MINUS : "")) + n + "%";
  }
  function cls(v){ return v > 0 ? "up" : (v < 0 ? "down" : ""); }

  /* ---------- views ---------- */
  var views = {journal:$("view-journal"), post:$("view-post"), portfolio:$("view-portfolio")};
  function show(name){
    Object.keys(views).forEach(function(k){ views[k].hidden = (k !== name); });
    var navKey = name === "post" ? "journal" : name;
    document.querySelectorAll(".nav a").forEach(function(a){
      if(a.getAttribute("data-nav") === navKey) a.setAttribute("aria-current","page");
      else a.removeAttribute("aria-current");
    });
  }

  /* ---------- journal ---------- */
  function renderLatest(){
    var p = POSTS[0];
    var chips = p.allTickers.map(function(t){ return '<a class="chip" href="#t-' + esc(t) + '">' + esc(t) + '</a>'; }).join("");
    $("latest").innerHTML =
      '<p class="meta"><span class="cat new">Latest</span><span class="sep" aria-hidden="true"></span><span class="cat">' + CAT[p.cat] + '</span><span class="sep" aria-hidden="true"></span><time datetime="' + p.date + '">' + fmtMid(p.date) + '</time></p>' +
      '<h1 class="latest-title"><a href="#' + p.id + '">' + esc(p.title) + '</a></h1>' +
      '<p class="dek">' + esc(p.dek) + '</p>' +
      '<div class="row">' + (chips ? '<div class="chips">' + chips + '</div>' : '') + '<a class="more" href="#' + p.id + '">Read the post <span aria-hidden="true">&rarr;</span></a></div>';
  }

  function sparkPath(vals, w, h){
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var pad = 3, n = vals.length - 1;
    var pts = vals.map(function(v, i){
      var x = (i / n) * w;
      var y = pad + (1 - (v - min) / (max - min || 1)) * (h - pad * 2);
      return [x, y];
    });
    var line = pts.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("");
    var area = line + "L" + w + " " + h + "L0 " + h + "Z";
    return {line:line, area:area, last:pts[pts.length - 1]};
  }

  function renderSnapshot(){
    var vals = SERIES.acct.filter(function(v, i){ return i % 3 === 0 || i === SERIES.acct.length - 1; });
    var sp = sparkPath(vals, 200, 36);
    $("snapshot").innerHTML =
      '<p class="label"><span>Account</span><span>' + fmtMid(ASOF).replace(/, \d+$/, "") + ' close</span></p>' +
      '<dl class="kpis">' +
        '<div class="kpi"><dt>Since start</dt><dd class="v ' + cls(SUMMARY.sinceStart) + '">' + signed(SUMMARY.sinceStart) + '</dd><dd class="cap">Account value vs. money put in</dd></div>' +
        '<div class="kpi"><dt>2026 so far</dt><dd class="v ' + cls(SUMMARY.ytd) + '">' + signed(SUMMARY.ytd) + '</dd><dd class="cap">Time-weighted &middot; S&amp;P 500 ' + signed(SUMMARY.spxYtd) + '</dd>' +
          '<dd class="spark" aria-hidden="true"><svg viewBox="0 0 200 36" preserveAspectRatio="none" width="100%" height="36"><path d="' + sp.area + '" fill="var(--accent)" fill-opacity=".1"/><path d="' + sp.line + '" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></dd></div>' +
        '<div class="kpi"><dt>Cash</dt><dd class="v">' + SUMMARY.cash.toFixed(1) + '%</dd><dd class="cap">' + SUMMARY.positions + ' positions</dd></div>' +
      '</dl>' +
      '<a class="more" href="#portfolio">Full portfolio <span aria-hidden="true">&rarr;</span></a>';
  }

  function matches(p){
    if(state.cat !== "all" && p.cat !== state.cat) return false;
    if(state.ticker && p.allTickers.indexOf(state.ticker) === -1) return false;
    if(state.q){
      var terms = state.q.split(/\s+/);
      for(var i = 0; i < terms.length; i++){ if(terms[i] && p.hay.indexOf(terms[i]) === -1) return false; }
    }
    return true;
  }

  function renderList(){
    var list = $("list");
    var shown = POSTS.filter(matches);
    var html = "", cur = "";
    shown.forEach(function(p){
      var d = parts(p.date), key = d.y + "-" + d.m;
      if(key !== cur){
        if(cur) html += "</section>";
        html += '<section class="month"><h3 class="month-h">' + MONTHS[d.m] + " " + d.y + "</h3>";
        cur = key;
      }
      var tks = p.allTickers.slice(0, 4).map(function(t){ return '<span class="chip">' + esc(t) + '</span>'; }).join("");
      if(p.allTickers.length > 4) tks += '<span class="chip">+' + (p.allTickers.length - 4) + '</span>';
      html += '<a class="item" href="#' + p.id + '">' +
        '<time class="d" datetime="' + p.date + '">' + fmtShort(p.date) + '</time>' +
        '<div class="main"><span class="label cat">' + CAT[p.cat] + '</span><h4 class="ttl">' + esc(p.title) + '</h4><p class="dk">' + esc(p.dek) + '</p></div>' +
        '<div class="tk">' + tks + '</div></a>';
    });
    if(cur) html += "</section>";
    list.innerHTML = html;
    $("empty").hidden = shown.length > 0;

    var af = $("activeFilter");
    if(state.ticker){
      af.hidden = false;
      af.innerHTML = '<span>Posts about</span><button type="button" class="clear" id="clearTicker" aria-label="Clear ticker filter ' + esc(state.ticker) + '">' + esc(state.ticker) + ' <span aria-hidden="true">&times;</span></button>';
      $("clearTicker").addEventListener("click", function(){ location.hash = "journal"; });
    } else {
      af.hidden = true; af.innerHTML = "";
    }
    document.querySelectorAll("#seg button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-cat") === state.cat)); });
  }

  document.querySelectorAll("#seg button").forEach(function(b){
    b.addEventListener("click", function(){ state.cat = b.getAttribute("data-cat"); renderList(); });
  });
  $("q").addEventListener("input", function(e){ state.q = e.target.value.trim().toLowerCase(); renderList(); });
  $("clearAll").addEventListener("click", function(){
    state.cat = "all"; state.q = ""; $("q").value = "";
    if(state.ticker){ location.hash = "journal"; } else { renderList(); }
  });

  /* ---------- post ---------- */
  function specHtml(s){
    return '<div class="spec"><div class="spec-head"><span class="spec-t">' + esc(s.t) + '</span><span class="spec-n">' + esc(s.name) + '</span><span class="spec-l">' + esc(s.layer) + '</span></div>' +
      '<dl class="spec-rows">' +
        '<div><dt>What it does</dt><dd>' + esc(s.does) + '</dd></div>' +
        '<div><dt>Move</dt><dd>' + esc(s.move) + '</dd></div>' +
        '<div><dt>Watching</dt><dd>' + esc(s.watch) + '</dd></div>' +
      '</dl></div>';
  }

  function renderPost(p){
    var older = POSTS[p.idx + 1], newer = POSTS[p.idx - 1];
    var chips = p.allTickers.map(function(t){ return '<a class="chip" href="#t-' + esc(t) + '">' + esc(t) + '</a>'; }).join("");
    var pager = '<nav class="pager" aria-label="More posts">' +
      (older ? '<a class="prev" href="#' + older.id + '"><span class="label dir">&larr; Older</span><span class="pt">' + esc(older.title) + '</span></a>' : '') +
      (newer ? '<a class="next" href="#' + newer.id + '"><span class="label dir">Newer &rarr;</span><span class="pt">' + esc(newer.title) + '</span></a>' : '') +
      '</nav>';
    $("postRoot").innerHTML =
      '<a class="back" href="#' + (state.listHash || "journal") + '"><span aria-hidden="true">&larr;</span> ' + (state.ticker ? "Posts about " + esc(state.ticker) : "Journal") + '</a>' +
      '<article>' +
        '<p class="meta"><span class="cat">' + CAT[p.cat] + '</span><span class="sep" aria-hidden="true"></span><time datetime="' + p.date + '">' + fmtLong(p.date) + '</time></p>' +
        '<h1 class="post-title">' + esc(p.title) + '</h1>' +
        '<p class="post-dek">' + esc(p.dek) + '</p>' +
        (p.spec ? '<div class="specs">' + p.spec.map(specHtml).join("") + '</div>' : '') +
        '<div class="prose">' + p.body + '</div>' +
      '</article>' +
      '<div class="post-foot">' + (chips ? '<div class="chips" aria-label="Tickers in this post">' + chips + '</div>' : '') + pager + '</div>';
    document.title = p.title + " · Bottleneck";
  }

  /* ---------- portfolio ---------- */
  function layerTotals(){
    var t = {};
    LAYERS.forEach(function(l){ t[l] = {w:0, tk:[]}; });
    HOLDINGS.forEach(function(h){ t[h.layer].w += h.w; t[h.layer].tk.push(h.t); });
    return LAYERS.map(function(l){ return {name:l, w:t[l].w, tk:t[l].tk}; }).sort(function(a,b){ return b.w - a.w; });
  }

  function renderPortfolio(){
    var layers = layerTotals();
    var maxW = Math.max(SUMMARY.cash, layers[0].w);
    var alloc = layers.map(function(l){
      return '<div class="arow"><div class="aname">' + esc(l.name) + '<span class="atk">' + l.tk.join(" · ") + '</span></div>' +
        '<div class="abar" aria-hidden="true"><i style="width:' + (l.w / maxW * 100).toFixed(1) + '%"></i></div>' +
        '<div class="aval">' + l.w.toFixed(1) + '%</div></div>';
    }).join("") +
      '<div class="arow cash"><div class="aname">Cash<span class="atk">Money market</span></div><div class="abar" aria-hidden="true"><i style="width:' + (SUMMARY.cash / maxW * 100).toFixed(1) + '%"></i></div><div class="aval">' + SUMMARY.cash.toFixed(1) + '%</div></div>';

    var months = MONTHLY.map(function(m){ return '<th scope="col">' + m[0] + '</th>'; }).join("");
    function mrow(label, idx, ytd, main){
      return '<tr' + (main ? ' class="main"' : '') + '><td>' + label + '</td>' + MONTHLY.map(function(m){ return '<td class="' + cls(m[idx]) + '">' + signed(m[idx]) + '</td>'; }).join("") + '<td class="ytd ' + cls(ytd) + '">' + signed(ytd) + '</td></tr>';
    }

    $("pfRoot").innerHTML =
      '<div class="page-head"><h1 class="page-title">Portfolio</h1><p class="asof">As of the ' + fmtLong(ASOF) + ' close</p></div>' +
      '<div class="kpi-strip">' +
        '<div class="tile"><span class="label">Since start</span><span class="v ' + cls(SUMMARY.sinceStart) + '">' + signed(SUMMARY.sinceStart) + '</span><span class="cap">Account value vs. money put in</span></div>' +
        '<div class="tile"><span class="label">2026 so far</span><span class="v ' + cls(SUMMARY.ytd) + '">' + signed(SUMMARY.ytd) + '</span><span class="cap">Time-weighted &middot; S&amp;P 500 ' + signed(SUMMARY.spxYtd) + '</span></div>' +
        '<div class="tile"><span class="label">Cash</span><span class="v">' + SUMMARY.cash.toFixed(1) + '%</span><span class="cap">Of the account</span></div>' +
        '<div class="tile"><span class="label">Positions</span><span class="v">' + SUMMARY.positions + '</span><span class="cap">Plus cash</span></div>' +
      '</div>' +
      '<section class="card" aria-labelledby="perfTitle">' +
        '<div class="card-head"><div><h2 class="card-title" id="perfTitle">2026 return</h2><p class="card-sub">Time-weighted, from December 31, 2025</p></div>' +
          '<ul class="legend" aria-hidden="true">' +
            '<li><span class="key" style="background:var(--accent)"></span>Account</li>' +
            '<li><span class="key" style="background:var(--ctx-1)"></span>Semiconductor ETF (SMH)</li>' +
            '<li><span class="key" style="background:var(--ctx-2)"></span>S&amp;P 500</li>' +
          '</ul></div>' +
        '<div class="chart" id="chart" tabindex="0" role="img" aria-label="Line chart of 2026 time-weighted returns. Account up ' + SUMMARY.ytd + ' percent, semiconductor ETF up ' + SUMMARY.smhYtd + ' percent, S&amp;P 500 up ' + SUMMARY.spxYtd + ' percent. The account peaked near plus 127 percent on June 2 and fell to plus 36 percent on July 29. Monthly figures are in the table below."></div>' +
        '<div class="table-wrap"><table class="monthly"><caption class="sr">Monthly returns in 2026</caption><thead><tr><th scope="col">Month</th>' + months + '<th scope="col">2026</th></tr></thead><tbody>' +
          mrow("Account", 1, SUMMARY.ytd, true) + mrow("SMH", 3, SUMMARY.smhYtd) + mrow("S&amp;P 500", 2, SUMMARY.spxYtd) +
        '</tbody></table></div>' +
      '</section>' +
      '<section class="card" aria-labelledby="allocTitle"><div class="card-head"><h2 class="card-title" id="allocTitle">Where the money sits</h2><p class="card-sub">Share of the account by layer of the AI buildout</p></div><div class="alloc">' + alloc + '</div></section>' +
      '<section class="card" aria-labelledby="holdTitle"><div class="card-head"><h2 class="card-title" id="holdTitle">Holdings</h2><p class="card-sub">Select a row to read every post about it</p></div><div class="hold-wrap" id="holdWrap"></div></section>' +
      '<p class="note">Return vs. cost uses the brokerage cost basis. Time-weighted returns remove the effect of when cash was added.</p>';
    renderHoldings();
    renderChart();
  }

  function renderHoldings(){
    var rows = HOLDINGS.slice().sort(function(a,b){ return state.sort === "r" ? b.r - a.r : b.w - a.w; });
    var maxW = HOLDINGS.reduce(function(m,h){ return Math.max(m, h.w); }, SUMMARY.cash);
    var body = rows.map(function(h){
      return '<tr data-t="' + h.t + '" tabindex="0" aria-label="' + esc(h.name) + ', ' + h.w.toFixed(1) + ' percent of account, ' + signed(h.r) + ' versus cost. Open posts.">' +
        '<td class="tkr">' + h.t + '</td>' +
        '<td class="co">' + esc(h.name) + '</td>' +
        '<td class="ly">' + esc(h.layer) + '</td>' +
        '<td class="r"><div class="wcell"><span class="wbar" aria-hidden="true"><i style="width:' + (h.w / maxW * 100).toFixed(1) + '%"></i></span><span class="num">' + h.w.toFixed(1) + '%</span></div></td>' +
        '<td class="r ret ' + cls(h.r) + '">' + signed(h.r) + '</td></tr>';
    }).join("") +
      '<tr class="cashrow"><td class="tkr">CASH</td><td class="co">Money market</td><td class="ly">&nbsp;</td><td class="r"><div class="wcell"><span class="wbar" aria-hidden="true"><i style="width:' + (SUMMARY.cash / maxW * 100).toFixed(1) + '%"></i></span><span class="num">' + SUMMARY.cash.toFixed(1) + '%</span></div></td><td class="r ret">&nbsp;</td></tr>';
    $("holdWrap").innerHTML = '<table class="holdings"><thead><tr>' +
      '<th scope="col">Ticker</th><th scope="col">Company</th><th scope="col" class="ly">Layer</th>' +
      '<th scope="col" class="r"><button type="button" data-sort="w" aria-pressed="' + (state.sort === "w") + '">Weight</button></th>' +
      '<th scope="col" class="r"><button type="button" data-sort="r" aria-pressed="' + (state.sort === "r") + '">Vs. cost</button></th>' +
      '</tr></thead><tbody>' + body + '</tbody></table>';
    $("holdWrap").querySelectorAll("th button").forEach(function(b){
      b.addEventListener("click", function(){ state.sort = b.getAttribute("data-sort"); renderHoldings(); });
    });
    $("holdWrap").querySelectorAll("tbody tr[data-t]").forEach(function(tr){
      function go(){ location.hash = "t-" + tr.getAttribute("data-t"); }
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
    });
  }

  /* ---------- chart ---------- */
  var chartTimer = null, chartW = 0;
  function niceStep(range, target){
    var raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    var nf = f < 1.5 ? 1 : (f < 3 ? 2 : (f < 7 ? 5 : 10));
    return nf * mag;
  }
  function renderChart(){
    var box = $("chart");
    if(!box || views.portfolio.hidden) return;
    var W = box.clientWidth; if(!W) return;
    chartW = W;
    var narrow = W < 560;
    var H = narrow ? 230 : 320;
    var m = {t:14, r: narrow ? 10 : 150, b:28, l:40};
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var ts = SERIES.dates.map(function(d){ var p = parts(d); return Date.UTC(p.y, p.m, p.d); });
    var lastP = parts(SERIES.dates[SERIES.dates.length - 1]);
    var t0 = ts[0], t1 = Date.UTC(lastP.y, lastP.m + 1, 1);
    var all = SERIES.acct.concat(SERIES.spx, SERIES.smh);
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    var step = niceStep(hi - lo, narrow ? 4 : 6);
    var y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
    function X(t){ return m.l + (t - t0) / (t1 - t0) * iw; }
    function Y(v){ return m.t + (1 - (v - y0) / (y1 - y0)) * ih; }
    function path(arr){ return arr.map(function(v, i){ return (i ? "L" : "M") + X(ts[i]).toFixed(1) + " " + Y(v).toFixed(1); }).join(""); }

    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
    for(var v = y0; v <= y1 + 1e-9; v += step){
      var yy = Y(v).toFixed(1);
      s += '<line x1="' + m.l + '" x2="' + (m.l + iw) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + (Math.abs(v) < 1e-9 ? "var(--rule-2)" : "var(--grid)") + '" stroke-width="1"/>';
      s += '<text x="' + (m.l - 8) + '" y="' + yy + '" dy="0.32em" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">' + (v > 0 ? "+" : (v < 0 ? MINUS : "")) + Math.abs(v) + '%</text>';
    }
    for(var mo = 0; mo <= lastP.m; mo++){
      var tx = X(Date.UTC(2026, mo, 1));
      if(narrow && mo % 2 === 1) continue;
      s += '<text x="' + tx.toFixed(1) + '" y="' + (H - 8) + '" font-size="11" fill="var(--muted)">' + MON[mo] + '</text>';
      s += '<line x1="' + tx.toFixed(1) + '" x2="' + tx.toFixed(1) + '" y1="' + (m.t + ih) + '" y2="' + (m.t + ih + 4) + '" stroke="var(--rule-2)"/>';
    }
    s += '<path d="' + path(SERIES.spx) + '" fill="none" stroke="var(--ctx-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<path d="' + path(SERIES.smh) + '" fill="none" stroke="var(--ctx-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<path d="' + path(SERIES.acct) + '" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>';

    var n = ts.length - 1;
    if(!narrow){
      var pk = 0, tr = 0;
      SERIES.acct.forEach(function(v, i){ if(v > SERIES.acct[pk]) pk = i; });
      tr = pk; for(var i = pk; i <= n; i++){ if(SERIES.acct[i] < SERIES.acct[tr]) tr = i; }
      [[pk, "High, " + fmtShort(SERIES.dates[pk]).replace(" 0", " "), -12], [tr, "Low, " + fmtShort(SERIES.dates[tr]).replace(" 0", " "), 20]].forEach(function(a){
        var px = X(ts[a[0]]), py = Y(SERIES.acct[a[0]]);
        s += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
        s += '<text x="' + px.toFixed(1) + '" y="' + (py + a[2]).toFixed(1) + '" text-anchor="middle" font-size="11" fill="var(--ink-2)">' + a[1] + " " + signed(SERIES.acct[a[0]], 0) + '</text>';
      });
      var ends = [["Account", SERIES.acct[n], "var(--accent)", "var(--ink)"], ["SMH", SERIES.smh[n], "var(--ctx-1)", "var(--ink-2)"], ["S&amp;P 500", SERIES.spx[n], "var(--ctx-2)", "var(--ink-2)"]];
      var placed = [];
      ends.forEach(function(e){
        var ey = Y(e[1]), ly = ey;
        placed.forEach(function(p){ if(Math.abs(ly - p) < 16) ly = p + (ly >= p ? 16 : -16); });
        placed.push(ly);
        var ex = X(ts[n]);
        s += '<circle cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="4" fill="' + e[2] + '" stroke="var(--surface)" stroke-width="2"/>';
        if(Math.abs(ly - ey) > 1) s += '<line x1="' + (ex + 6) + '" x2="' + (ex + 12) + '" y1="' + ey.toFixed(1) + '" y2="' + ly.toFixed(1) + '" stroke="var(--rule-2)"/>';
        s += '<text x="' + (ex + 14) + '" y="' + ly.toFixed(1) + '" dy="0.32em" font-size="12" fill="' + e[3] + '"><tspan font-weight="650" style="font-variant-numeric:tabular-nums">' + signed(e[1], 1) + '</tspan><tspan dx="6" fill="var(--muted)">' + e[0] + '</tspan></text>';
      });
    } else {
      s += '<circle cx="' + X(ts[n]).toFixed(1) + '" cy="' + Y(SERIES.acct[n]).toFixed(1) + '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    }
    s += '<g class="hover" visibility="hidden"><line class="hx" y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="var(--ink-2)" stroke-width="1" stroke-opacity=".5"/>' +
      '<circle class="h0" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle class="h1" r="4" fill="var(--ctx-1)" stroke="var(--surface)" stroke-width="2"/><circle class="h2" r="4" fill="var(--ctx-2)" stroke="var(--surface)" stroke-width="2"/></g>';
    s += '<rect class="hit" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="transparent"/>';
    s += '</svg><div class="tip" hidden></div>';
    box.innerHTML = s;

    var svg = box.querySelector("svg"), g = box.querySelector(".hover"), tip = box.querySelector(".tip");
    var cur = n;
    function place(i){
      cur = Math.max(0, Math.min(n, i));
      var x = X(ts[cur]);
      g.setAttribute("visibility", "visible");
      g.querySelector(".hx").setAttribute("x1", x); g.querySelector(".hx").setAttribute("x2", x);
      [["h0", SERIES.acct], ["h1", SERIES.smh], ["h2", SERIES.spx]].forEach(function(a){
        var c = g.querySelector("." + a[0]); c.setAttribute("cx", x); c.setAttribute("cy", Y(a[1][cur]));
      });
      tip.hidden = false;
      tip.innerHTML = "";
      var td = document.createElement("p"); td.className = "td"; td.textContent = fmtMid(SERIES.dates[cur]); tip.appendChild(td);
      [["Account", SERIES.acct, "var(--accent)"], ["SMH", SERIES.smh, "var(--ctx-1)"], ["S&P 500", SERIES.spx, "var(--ctx-2)"]].forEach(function(a){
        var row = document.createElement("div"); row.className = "tr";
        var k = document.createElement("span"); k.className = "key"; k.style.background = a[2];
        var v = document.createElement("span"); v.className = "tv"; v.textContent = signed(a[1][cur]);
        var l = document.createElement("span"); l.className = "tl"; l.textContent = a[0];
        row.appendChild(k); row.appendChild(v); row.appendChild(l); tip.appendChild(row);
      });
      var tw = tip.offsetWidth, left = x + 14;
      if(left + tw > W) left = x - tw - 14;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = (m.t + 4) + "px";
    }
    function hide(){ g.setAttribute("visibility", "hidden"); tip.hidden = true; }
    function nearest(clientX){
      var r = svg.getBoundingClientRect(), x = clientX - r.left;
      var t = t0 + (x - m.l) / iw * (t1 - t0), best = 0, bd = Infinity;
      for(var i = 0; i <= n; i++){ var dd = Math.abs(ts[i] - t); if(dd < bd){ bd = dd; best = i; } }
      return best;
    }
    var hit = box.querySelector(".hit");
    hit.addEventListener("pointermove", function(e){ place(nearest(e.clientX)); });
    hit.addEventListener("pointerdown", function(e){ place(nearest(e.clientX)); });
    hit.addEventListener("pointerleave", hide);
    box.onkeydown = function(e){
      if(e.key === "ArrowLeft"){ e.preventDefault(); place(cur - 1); }
      else if(e.key === "ArrowRight"){ e.preventDefault(); place(cur + 1); }
      else if(e.key === "Home"){ e.preventDefault(); place(0); }
      else if(e.key === "End"){ e.preventDefault(); place(n); }
      else if(e.key === "Escape"){ hide(); }
    };
    box.onfocus = function(){ place(cur); };
    box.onblur = hide;
  }
  if(window.ResizeObserver){
    new ResizeObserver(function(){
      var c = $("chart");
      if(!c || views.portfolio.hidden || c.clientWidth === chartW) return;
      clearTimeout(chartTimer); chartTimer = setTimeout(renderChart, 120);
    }).observe(document.body);
  } else {
    window.addEventListener("resize", function(){ clearTimeout(chartTimer); chartTimer = setTimeout(renderChart, 120); });
  }

  /* ---------- router ---------- */
  var lastView = "journal";
  function route(){
    var h = (location.hash || "").replace(/^#/, "");
    if(lastView === "journal" && !views.journal.hidden) state.listScroll = window.scrollY;
    if(h.indexOf("p-") === 0 && BY_ID[h]){
      renderPost(BY_ID[h]); show("post"); lastView = "post"; window.scrollTo(0, 0); return;
    }
    document.title = "Bottleneck";
    if(h === "portfolio"){
      show("portfolio"); renderPortfolio(); lastView = "portfolio"; window.scrollTo(0, 0); return;
    }
    var restore = (lastView === "post");
    if(h.indexOf("t-") === 0){
      state.ticker = h.slice(2).toUpperCase(); state.cat = "all"; restore = false;
    } else {
      state.ticker = null;
    }
    state.listHash = h || "journal";
    renderList(); show("journal");
    if(h.indexOf("t-") === 0){
      var a = document.querySelector(".archive");
      window.scrollTo(0, a ? a.getBoundingClientRect().top + window.scrollY - 70 : 0);
    } else {
      window.scrollTo(0, restore ? state.listScroll : 0);
    }
    lastView = "journal";
  }

  renderLatest();
  renderSnapshot();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
